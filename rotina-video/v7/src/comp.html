<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{--red:#CC0000;--red2:#E3262B;--green:#0F7A55;--green2:#159A6B;--ink:#232323;--grey:#6B6B6B;--paper:#F2F2F2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#EDEDED}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:540px 960px}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.bc{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;line-height:.88;white-space:nowrap}
.pp{font-family:'Poppins',sans-serif;white-space:nowrap}
.sc{font-family:'Allura',cursive;white-space:nowrap}
.layer{position:absolute;inset:0}
/* studio background */
#bg{background:radial-gradient(120% 80% at 55% 35%,#FAFAFA 0%,#EDEDED 55%,#DADADA 100%)}
#blinds{position:absolute;left:-600px;top:-400px;width:2400px;height:2800px;opacity:.16;filter:blur(26px);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 120px,rgba(40,40,40,1) 120px 150px);transform:rotate(-24deg)}
#blinds2{position:absolute;left:-300px;top:200px;width:1800px;height:1300px;opacity:.10;filter:blur(40px);
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 160px,rgba(40,40,40,1) 160px 190px);transform:rotate(-24deg)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(85% 70% at 50% 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.20) 100%);pointer-events:none}
/* phone */
#phoneWrap{position:absolute;left:0;top:0;width:520px;height:1139px;transform-style:preserve-3d}
#phone{position:absolute;inset:0;border-radius:82px;padding:14px;
  background:linear-gradient(135deg,#5b5e63 0%,#2a2c30 18%,#111214 50%,#2f3135 82%,#6a6d72 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 5px #0b0b0c,0 40px 80px rgba(0,0,0,.28),0 12px 24px rgba(0,0,0,.22)}
#screen{position:relative;width:492px;height:1111px;border-radius:68px;overflow:hidden;background:#080808}
#status{position:absolute;left:0;top:0;width:100%;height:46px;background:#080808;color:#fff;font:600 19px 'Poppins';display:flex;align-items:center;justify-content:space-between;padding:6px 40px 0 48px}
#island{position:absolute;left:50%;top:11px;width:128px;height:36px;margin-left:-64px;background:#000;border-radius:20px}
#app{position:absolute;left:0;top:46px;width:492px;height:1065px;display:block}
#boot{position:absolute;left:0;top:46px;width:492px;height:1065px;background:#080808}
#glare{position:absolute;inset:0;border-radius:68px;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%);pointer-events:none}
.touch{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.38);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid rgba(255,255,255,.7)}
#pshadow{position:absolute;width:520px;height:90px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(28px)}
/* pills & cards */
.pill{border-radius:26px;padding:18px 26px 14px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.lab{font-family:'Poppins';font-weight:500;font-size:30px;letter-spacing:.08em;text-transform:uppercase}
.card{width:440px;height:277px;border-radius:30px;padding:30px 34px;color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.35)}
.bar{height:30px;border-radius:15px;background:#D4D4D4;overflow:visible;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:15px}
.chk{width:74px;height:74px;border-radius:20px;border:5px solid #BDBDBD;background:#fff;position:relative}
.chk b{position:absolute;inset:-5px;border-radius:20px;background:#0F7A55}
.chk svg{position:absolute;left:10px;top:12px}
#fx{position:absolute;inset:0;pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="filters"></defs></svg>
<div id="stage">
  <div class="layer" id="bg"><div id="blinds"></div><div id="blinds2"></div></div>
  <div class="layer" id="panels"></div>
  <div class="layer" id="back"></div>
  <div class="abs" id="pshadow"></div>
  <div class="abs" id="phoneWrap"><div id="phone"><div id="screen">
    <img id="app"><div id="boot"></div>
    <div id="status"><span>08:40</span><span style="display:flex;gap:8px;align-items:center">
      <svg width="30" height="18" viewBox="0 0 30 18"><rect x="0" y="12" width="5" height="6" rx="1" fill="#fff"/><rect x="8" y="8" width="5" height="10" rx="1" fill="#fff"/><rect x="16" y="4" width="5" height="14" rx="1" fill="#fff"/><rect x="24" y="0" width="5" height="18" rx="1" fill="#fff"/></svg>
      <svg width="40" height="19" viewBox="0 0 40 19"><rect x="1" y="1" width="33" height="17" rx="5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><rect x="4" y="4" width="24" height="11" rx="3" fill="#fff"/><rect x="36" y="6" width="3" height="7" rx="1.5" fill="#fff" fill-opacity=".6"/></svg></span></div>
    <div id="island"></div><div id="touches"></div><div id="glare"></div>
  </div></div></div>
  <div class="layer" id="front"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="vig"></div>
  <div class="layer" id="end"></div>
  <div id="fx"></div>
</div>
<script src="data.js"></script>
<script src="comp.js"></script>
</body></html>
