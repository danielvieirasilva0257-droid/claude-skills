  });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'check') return;
    const a = b.dataset.act, k = ui.date, st = top();
    switch (a) {
      // ---- sheet navigation
      case 'sback': popSheet(); break;
      case 'sclose': closeSheet(); break;
      // ---- hoje
      case 'day': ui.date = addDays(k, +b.dataset.n); render(); break;
      case 'today': ui.date = todayKey(); render(); break;
      case 'goplan': ui.tab = 'plano'; render(); window.scrollTo({ top: 0 }); break;
      case 'all': { const m = findMeal(dayMeals(k), b.dataset.meal), lg = dayLog(k, true), all = mealNow(k, m).all; m.dishes.forEach(x => { lg.chk[ckey(m, x)] = !all; }); stamp(k); persist('log', k); render(); focusAfter(`[data-act="all"][data-meal="${m.id}"]`, true); if (!all) toast('✅ ' + m.name + ' registrado!'); break; }
      case 'addto': openSheet({ kind: 'pick', mode: 'day', meal: b.dataset.meal, mealName: mealNameOf(b.dataset.meal), tab: 'r', q: '' }); break;
      case 'picktab': st.tab = b.dataset.id; st.q = ''; renderSheet(); break;
      case 'pickitem': {
        if (st.mode === 'ing') { const prev = stack[stack.length - 2]; prev.r.items.push({ id: b.dataset.id, q: 1 }); popSheet(); break; }
        const entry = { u: uid('u'), t: b.dataset.t, id: b.dataset.id, q: 1 };
        if (st.mode === 'draft') { ui.draft.d.meals[st.m].dishes.push(entry); ui.draft.changed = true; closeSheet(); render(); toast('➕ ' + entryInfo(entry).n); break; }
        pushSheet({ kind: 'confirm', meal: st.meal, mealName: st.mealName, entry }); break;
      }
      case 'picknewrecipe': pushSheet({ kind: 'recipe', r: { e: '🍽️', n: '', items: [] }, from: 'pick' }); break;
      case 'picknewfood': pushSheet({ kind: 'food', f: { e: '🍽️', n: '', por: '', k: '', p: '', c: '', g: '', f: '' }, from: 'pick' }); break;
      case 'cq': st.entry.q = Math.max(0.5, Math.round((st.entry.q + +b.dataset.d) * 2) / 2); renderSheet(); break;
      case 'addscope': {
        const entry = clone(st.entry), meal = st.meal, nm = entryInfo(entry).n;
        if (b.dataset.scope === 'day') { entry.today = true; const meals = ensureOverride(k); findMeal(meals, meal).dishes.push(entry); stamp(k); persist('log', k); closeSheet(); render(); toast('📅 ' + nm + ' só neste dia'); }
        else { const res = changeDietEveryDay(k, (meals) => { const m = findMeal(meals, meal); if (m) m.dishes.push(clone(entry)); }); stamp(k); persist('log', k); closeSheet(); render(); afterDietChange(res, nm + ' adicionado'); }
        break;
      }
      case 'dishmenu': openSheet({ kind: 'dish', meal: b.dataset.meal, u: b.dataset.u }); break;
      case 'rmscope': {
        const meal = st.meal, u = st.u, m0 = findMeal(dayMeals(k), meal), e0 = m0.dishes.find(x => x.u === u), nm = entryInfo(e0).n;
        if (b.dataset.scope === 'day') { const meals = ensureOverride(k); const m = findMeal(meals, meal); m.dishes = m.dishes.filter(x => x.u !== u); stamp(k); persist('log', k); closeSheet(); render(); toast('📅 ' + nm + ' tirado só deste dia'); }
        else { const res = changeDietEveryDay(k, (meals) => { const m = findMeal(meals, meal); if (m) m.dishes = m.dishes.filter(x => x.u !== u); }); stamp(k); persist('log', k); closeSheet(); render(); afterDietChange(res, nm + ' tirado'); }
        break;
      }
      case 'dishedit': { const m = findMeal(dayMeals(k), st.meal), e1 = m.dishes.find(x => x.u === st.u); pushSheet({ kind: 'recipe', r: clone(recipe(e1.id)), from: 'dish' }); break; }
      case 'newmealday': openSheet({ kind: 'name', title: '➕ Nova refeição', obj: { e: '🍽️', n: '' }, ph: 'Ex.: Lanche da manhã', save: 'savemealday', scope: true }); break;
      case 'savemealday': {
        syncForm(); const o = st.obj, name = (o.n || '').trim() || 'Refeição', meal = { id: uid('m'), e: o.e || '🍽️', name, dishes: [] };
        if (b.dataset.scope === 'day') { ensureOverride(k).push(meal); persist('log', k); closeSheet(); render(); toast('📅 ' + meal.e + ' ' + name + ' só neste dia'); }
        else { const res = changeDietEveryDay(k, (meals) => meals.push(clone(meal))); persist('log', k); closeSheet(); render(); afterDietChange(res, meal.e + ' ' + name + ' criada'); }
        break;
      }
      // ---- recipe editor
      case 'iadd': syncForm(); pushSheet({ kind: 'pick', mode: 'ing', q: '' }); break;
      case 'iq': { syncForm(); const it = st.r.items[+b.dataset.i]; it.q = Math.max(0.5, Math.round((it.q + +b.dataset.d) * 2) / 2); renderSheet(); break; }
      case 'irm': syncForm(); st.r.items.splice(+b.dataset.i, 1); renderSheet(); break;
      case 'saverecipe': {
        syncForm(); const r = st.r; r.n = (r.n || '').trim(); if (!r.n) { toast('Dê um nome para a receita'); $('sheet').querySelector('#f-n').focus(); return; }
        if (!r.items.length) { toast('Adicione pelo menos um ingrediente'); return; }
        r.e = r.e || '🍽️'; let saved;
        if (r.id) { saved = recipe(r.id); Object.assign(saved, clone(r)); } else { r.id = uid('r'); saved = clone(r); cfg.recipes.push(saved); }
        persist('cfg'); stamp(k); persist('log', k);
        const from = st.from; stack.pop(); const prev = top();
        if (from === 'pick' && prev && prev.mode !== 'ing') {
          const entry = { u: uid('u'), t: 'r', id: saved.id, q: 1 };
          if (prev.mode === 'draft') { ui.draft.d.meals[prev.m].dishes.push(entry); ui.draft.changed = true; closeSheet(); render(); toast('🍲 Receita salva e adicionada'); }
          else { stack.push({ kind: 'confirm', meal: prev.meal, mealName: prev.mealName, entry }); renderSheet(true); render(); toast('🍲 Receita “' + saved.n + '” salva'); }
        } else { if (!stack.length) closeSheet(); else renderSheet(true); render(); toast('🍲 Receita “' + saved.n + '” salva'); }
        break;
      }
      case 'delrecipe': pushSheet({ kind: 'confirmdel', title: '🗑️ Excluir receita?', text: 'A receita sai da biblioteca e das dietas que a usam.', yes: 'delrecipe-yes', id: st.r.id }); break;
      case 'delrecipe-yes': { const id = st.id; cfg.recipes = cfg.recipes.filter(x => x.id !== id); cfg.diets.forEach(d => d.meals.forEach(m => { m.dishes = m.dishes.filter(x => !(x.t === 'r' && x.id === id)); })); persist('cfg'); closeSheet(); render(); toast('🗑️ Receita excluída'); break; }
      // ---- food editor
      case 'savefood': {
        syncForm(); const f = st.f; f.n = (f.n || '').trim(); if (!f.n) { toast('Escreva o nome do alimento'); $('sheet').querySelector('#f-n').focus(); return; }
        const data = { e: f.e || '🍽️', n: f.n, por: (f.por || '').trim() || '1 porção', f: (f.f || '').trim(), k: numIn(f.k), p: numIn(f.p), c: numIn(f.c), g: numIn(f.g) };
        let saved; if (f.id) { saved = food(f.id); Object.assign(saved, data); } else { saved = Object.assign({ id: uid('f') }, data); cfg.foods.push(saved); }
        persist('cfg'); stamp(k); persist('log', k);
        const from = st.from; stack.pop(); const prev = top();
        if (from === 'pick' && prev) {
          if (prev.mode === 'ing') { stack.pop(); top().r.items.push({ id: saved.id, q: 1 }); renderSheet(true); }
          else { const entry = { u: uid('u'), t: 'f', id: saved.id, q: 1 }; if (prev.mode === 'draft') { ui.draft.d.meals[prev.m].dishes.push(entry); ui.draft.changed = true; closeSheet(); } else { stack.push({ kind: 'confirm', meal: prev.meal, mealName: prev.mealName, entry }); renderSheet(true); } }
        } else if (!stack.length) closeSheet(); else renderSheet(true);
        render(); toast('🥕 ' + saved.e + ' ' + saved.n + ' salvo'); break;
      }
      case 'delfood': pushSheet({ kind: 'confirmdel', title: '🗑️ Excluir alimento?', text: 'O alimento sai da biblioteca, das receitas e das dietas.', yes: 'delfood-yes', id: st.f.id }); break;
      case 'delfood-yes': { const id = st.id; cfg.foods = cfg.foods.filter(x => x.id !== id); cfg.recipes.forEach(r => { r.items = r.items.filter(i => i.id !== id); }); cfg.diets.forEach(d => d.meals.forEach(m => { m.dishes = m.dishes.filter(x => !(x.t === 'f' && x.id === id)); })); persist('cfg'); closeSheet(); render(); toast('🗑️ Alimento excluído'); break; }
      // ---- progresso
      case 'prog': ui.prog = b.dataset.id; render(); break;
      case 'metric': ui.metric = b.dataset.id; render(); break;
      case 'pnav': { if (ui.prog === 'semana') ui.date = addDays(k, 7 * b.dataset.n); else { const dt = parseKey(k.slice(0, 7) + '-01'); dt.setMonth(dt.getMonth() + +b.dataset.n); ui.date = keyOf(dt); } render(); break; }
      case 'openday': ui.date = b.dataset.k; ui.tab = 'hoje'; closeSheet(); render(); window.scrollTo({ top: 0 }); break;
      // ---- plano
      case 'weekdiet': cfg.week[b.dataset.w] = b.dataset.id; persist('cfg'); render(); focusAfter(`[data-act="weekdiet"][data-w="${b.dataset.w}"][data-id="${b.dataset.id}"]`); break;
      case 'mnav': { const dt = parseKey(ui.planMonth + '-01'); dt.setMonth(dt.getMonth() + +b.dataset.n); ui.planMonth = keyOf(dt).slice(0, 7); render(); break; }
      case 'planday': openSheet({ kind: 'planday', k: b.dataset.k }); break;
      case 'setdayplan': { const kk = st.k; if (b.dataset.id) cfg.dayDiet[kk] = b.dataset.id; else delete cfg.dayDiet[kk]; persist('cfg'); if (logs[kk]) { stamp(kk); persist('log', kk); } closeSheet(); render(); toast('🗓️ Dieta do dia atualizada'); break; }
      // ---- biblioteca
      case 'libtab': ui.libTab = b.dataset.id; ui.libQ = ''; render(); break;
      case 'libopen': if (b.dataset.t === 'r') openSheet({ kind: 'recipe', r: clone(recipe(b.dataset.id)), from: 'lib' }); else openSheet({ kind: 'food', f: clone(food(b.dataset.id)), from: 'lib' }); break;
      case 'newrecipe': openSheet({ kind: 'recipe', r: { e: '🍽️', n: '', items: [] }, from: 'lib' }); break;
      case 'newfood': openSheet({ kind: 'food', f: { e: '🍽️', n: '', por: '', k: '', p: '', c: '', g: '', f: '' }, from: 'lib' }); break;
      // ---- dietas
      case 'newdiet': ui.draft = { base: null, changed: true, d: { id: null, e: '🥗', name: 'Nova dieta', note: '', target: { k: 0, p: 0, c: 0, g: 0 }, meals: [['🍳', 'Café da manhã'], ['🍛', 'Almoço'], ['🥤', 'Lanche da tarde'], ['🌙', 'Jantar']].map(([e1, n1]) => ({ id: uid('m'), e: e1, name: n1, dishes: [] })) } }; render(); window.scrollTo({ top: 0 }); break;
      case 'editdiet': ui.draft = { base: b.dataset.id, changed: false, d: clone(diet(b.dataset.id)) }; render(); window.scrollTo({ top: 0 }); break;
      case 'dupdiet': { const nd = clone(diet(b.dataset.id)); nd.id = uid('d'); nd.name = nextName(nd.name); nd.created = todayKey(); nd.from = b.dataset.id; cfg.diets.push(nd); persist('cfg'); render(); toast('📄 Criada “' + nd.name + '”'); break; }
      case 'defdiet': cfg.def = b.dataset.id; persist('cfg'); render(); toast('⭐ Dieta padrão: ' + diet(b.dataset.id).name); break;
      case 'deldiet': openSheet({ kind: 'confirmdel', title: '🗑️ Excluir dieta?', text: 'A dieta “' + diet(b.dataset.id).name + '” sai da lista. Os dias já registrados continuam no histórico.', yes: 'deldiet-yes', id: b.dataset.id }); break;
      case 'deldiet-yes': { const id = st.id; cfg.diets = cfg.diets.filter(x => x.id !== id); if (cfg.def === id) cfg.def = cfg.diets[0].id; Object.keys(cfg.week).forEach(w => { if (cfg.week[w] === id) delete cfg.week[w]; }); Object.keys(cfg.dayDiet).forEach(x => { if (cfg.dayDiet[x] === id) delete cfg.dayDiet[x]; }); persist('cfg'); closeSheet(); render(); toast('🗑️ Dieta excluída'); break; }
      case 'draftcancel': if (ui.draft.changed) openSheet({ kind: 'confirmdel', title: 'Descartar mudanças?', text: 'As alterações nesta dieta não foram salvas.', yes: 'draftdiscard' }); else { ui.draft = null; render(); } break;
      case 'draftdiscard': ui.draft = null; closeSheet(); render(); break;
      case 'draftmeta': { const d = ui.draft.d; openSheet({ kind: 'dietmeta', obj: { e: d.e, n: d.name, note: d.note, target: clone(d.target) } }); break; }
      case 'savedietmeta': { syncForm(); const o = st.obj, d = ui.draft.d; d.e = o.e || d.e; d.name = (o.n || '').trim() || d.name; d.note = (o.note || '').trim(); d.target = { k: numIn(o.target.k), p: numIn(o.target.p), c: numIn(o.target.c), g: numIn(o.target.g) }; ui.draft.changed = true; closeSheet(); render(); break; }
      case 'draftmetafromdishes': { const pl = dietPlanned(ui.draft.d); ui.draft.d.target = { k: Math.round(pl[0]), p: Math.round(pl[1] * 10) / 10, c: Math.round(pl[2] * 10) / 10, g: Math.round(pl[3] * 10) / 10 }; ui.draft.changed = true; render(); toast('🎯 Meta = soma dos pratos'); break; }
      case 'draftadd': { const m = ui.draft.d.meals[+b.dataset.m]; openSheet({ kind: 'pick', mode: 'draft', m: +b.dataset.m, mealName: m.e + ' ' + m.name, tab: 'r', q: '' }); break; }
      case 'draftq': { const e1 = ui.draft.d.meals[+b.dataset.m].dishes[+b.dataset.e]; e1.q = Math.max(0.5, Math.round((e1.q + +b.dataset.d) * 2) / 2); ui.draft.changed = true; render(); focusAfter(`[data-act="draftq"][data-m="${b.dataset.m}"][data-e="${b.dataset.e}"][data-d="${b.dataset.d}"]`); break; }
      case 'draftrmdish': ui.draft.d.meals[+b.dataset.m].dishes.splice(+b.dataset.e, 1); ui.draft.changed = true; render(); break;
      case 'draftmeal': { const m = ui.draft.d.meals[+b.dataset.m]; openSheet({ kind: 'name', title: '✏️ Refeição', obj: { e: m.e, n: m.name, mi: +b.dataset.m }, save: 'savedraftmeal' }); break; }
      case 'draftnewmeal': openSheet({ kind: 'name', title: '➕ Nova refeição', obj: { e: '🍽️', n: '', mi: -1 }, ph: 'Ex.: Lanche da manhã', save: 'savedraftmeal' }); break;
      case 'savedraftmeal': { syncForm(); const o = st.obj, name = (o.n || '').trim() || 'Refeição'; if (o.mi >= 0) { const m = ui.draft.d.meals[o.mi]; m.e = o.e || m.e; m.name = name; } else ui.draft.d.meals.push({ id: uid('m'), e: o.e || '🍽️', name, dishes: [] }); ui.draft.changed = true; closeSheet(); render(); break; }
      case 'draftmove': { const ms = ui.draft.d.meals, i = +b.dataset.m, j = i + +b.dataset.d; if (j < 0 || j >= ms.length) break; [ms[i], ms[j]] = [ms[j], ms[i]]; ui.draft.changed = true; render(); break; }
      case 'draftrmmeal': ui.draft.d.meals.splice(+b.dataset.m, 1); ui.draft.changed = true; render(); toast('🗑️ Refeição tirada (salve para confirmar)'); break;
      case 'draftsave': if (!ui.draft.base) { const d = ui.draft.d; d.id = uid('d'); d.created = todayKey(); cfg.diets.push(d); ui.draft = null; persist('cfg'); render(); toast('✨ Dieta “' + d.name + '” criada'); } else openSheet({ kind: 'draftsave' }); break;
      case 'dsave': {
        const dr = ui.draft, t = todayKey();
        if (b.dataset.how === 'replace') { const i = cfg.diets.findIndex(x => x.id === dr.base); cfg.diets[i] = Object.assign(dr.d, { id: dr.base }); toast('✏️ “' + dr.d.name + '” atualizada'); }
        else { const old = diet(dr.base), d = dr.d; d.id = uid('d'); d.name = nextName(old.name); d.created = t; d.from = old.id; cfg.diets.push(d); retarget(old.id, d.id); toast('✨ Criada “' + d.name + '”; “' + old.name + '” ficou guardada'); }
        ui.draft = null; persist('cfg'); stamp(ui.date); persist('log', ui.date); closeSheet(); render(); break;
      }
    }
  });

  document.addEventListener('change', e => {
    const b = e.target.closest('[data-act="check"]'); if (!b) return;
    const k = ui.date, m = findMeal(dayMeals(k), b.dataset.meal), lg = dayLog(k, true);
    lg.chk[m.id + ':' + b.dataset.u] = b.checked; stamp(k); persist('log', k);
    const id = b.id; render(); focusAfter('#' + CSS.escape(id));
    if (b.checked && mealNow(k, m).all) toast('✅ ' + m.name + ' completo!');
  });
  document.addEventListener('input', e => { if (e.target.id === 'libq') { ui.libQ = e.target.value; $('liblist').innerHTML = libList(ui.libTab, ui.libQ, 'libopen'); } });

  // chart tooltip (hover + tap)
  function showTip(hit) {
    const chart = hit.closest('.chart'); if (!chart) return;
    chart.querySelectorAll('.tip').forEach(t => t.remove());
    const [a1, b1] = JSON.parse(chart.dataset.tips)[+hit.dataset.tip].split('|');
    const r = hit.getBoundingClientRect(), cr = chart.getBoundingClientRect();
    const tip = document.createElement('div'); tip.className = 'tip num'; tip.innerHTML = `<b>${esc(b1)}</b>${esc(a1)}`;
    tip.style.left = Math.min(Math.max(r.left - cr.left + r.width / 2, 80), cr.width - 80) + 'px'; tip.style.top = '24px';
    chart.appendChild(tip);
  }
  document.addEventListener('pointerover', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) showTip(h); });
  document.addEventListener('pointerdown', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) showTip(h); else document.querySelectorAll('.tip').forEach(t => t.remove()); });
  document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.chart') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.chart'))) document.querySelectorAll('.tip').forEach(t => t.remove()); });

  // Android back button (APK wrapper calls this; returns true when handled)
  window.__mdBack = () => {
    if (stack.length > 1) { popSheet(); return true; }
    if (stack.length) { closeSheet(); return true; }
    if (ui.tab === 'dietas' && ui.draft) { document.querySelector('[data-act="draftcancel"]').click(); return true; }
    if (ui.tab !== 'hoje') { ui.tab = 'hoje'; render(); window.scrollTo({ top: 0 }); return true; }
    return false;
  };
  const mq = window.matchMedia('(max-width: 639px)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => { if (ui.tab === 'progresso') render(); });

  try { localStorage.setItem(LS, JSON.stringify({ cfg, logs })); } catch (e) {}
  render();
  connect();
})();
</script>
</body>
</html>
