<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Dieta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#08060C">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Layout: phone-first app; header, view area, fixed bottom tab bar, bottom-sheet pop-ups. */
  :root {
    --black: #08060C;
    --sheet: #120E1A;
    --surface: rgba(255, 255, 255, .045);
    --surface-2: rgba(255, 255, 255, .08);
    --line: rgba(255, 255, 255, .10);
    --text: #F6F3FB;
    --text-2: #BDB4CC;
    --text-3: #8E849F;
    --red: #FF3B5C;
    --purple: #8B5CF6;
    --lilac: #CDB8FF;
    /* chart series (validated: dark band, CVD-safe) */
    --s-k: #FF3B5C; --s-p: #967CEB; --s-c: #6236D0; --s-g: #D9488F;
    --ok: #34D399;
    --grad: linear-gradient(135deg, #FF3B5C 0%, #A23BEB 55%, #8B5CF6 100%);
    --sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
    --r-sm: 10px; --r-md: 16px; --r-lg: 24px;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --tabbar: 72px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
  body { margin: 0; min-height: 100%; color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; background-color: var(--black); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--black); }
  .bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 55% at 0% 0%, rgba(139, 92, 246, .62), transparent 70%),
      radial-gradient(60% 50% at 100% 18%, rgba(255, 59, 92, .48), transparent 70%),
      radial-gradient(80% 60% at 50% 105%, rgba(205, 184, 255, .30), transparent 70%),
      linear-gradient(170deg, #160A26 0%, #08060C 45%, #1C0612 100%); }
  ::selection { background: rgba(139, 92, 246, .5); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -.03em; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--text-3); font-size: 14px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 880px; margin: 0 auto; padding-block: 18px calc(var(--tabbar) + 40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- Buttons (press .94, spring release) ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 15px; cursor: pointer; transition: transform .35s var(--spring), background-color .2s ease, border-color .2s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.13); }
  .btn:active { transform: scale(.94); transition-duration: .1s; }
  .btn.primary { background: var(--grad); border-color: transparent; box-shadow: 0 8px 24px -10px rgba(255,59,92,.7); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: rgba(255, 59, 92, .16); border-color: rgba(255, 59, 92, .4); }
  .btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .btn.icon { width: 40px; min-height: 40px; padding: 0; font-size: 18px; }
  .btn.block { width: 100%; }
  .pop { animation: pop .45s var(--spring); }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  /* ---------- Header ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .top h1 { font-size: clamp(36px, 8vw, 56px); font-weight: 900; font-stretch: 118%; letter-spacing: -.045em; line-height: .9; }
  .top h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .view-title { font-size: 28px; font-weight: 800; margin: 6px 0 14px; }

  /* ---------- Cards ---------- */
  .card { padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
  .stack { display: grid; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1 1 auto; min-width: 0; }

  /* ---------- Day nav ---------- */
  .daynav { display: flex; align-items: center; gap: 8px; }
  .daynav .d { flex: 1; text-align: center; min-width: 0; }
  .daynav .d b { display: block; font-size: 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; font-weight: 700; font-size: 14px; transition: transform .35s var(--spring), background-color .2s ease; }
  .chip:active { transform: scale(.94); transition-duration: .1s; }
  .chip .e { font-size: 18px; }
  .chip small { font-weight: 500; color: var(--text-3); font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; }
  .chip[aria-pressed="true"] small { color: rgba(255,255,255,.85); }

  /* ---------- Dashboard ---------- */
  .dash { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center; }
  .ring { position: relative; width: 190px; height: 190px; justify-self: center; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .fg { transition: stroke-dashoffset .8s var(--ease-out); }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring .big { font-size: 40px; font-weight: 900; font-stretch: 112%; letter-spacing: -.04em; line-height: 1; }
  .ring .of { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .bars { display: grid; gap: 14px; min-width: 0; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  .bar-row .name { font-weight: 700; font-size: 15px; }
  .bar-row .val { font-size: 14px; color: var(--text-2); }
  .bar-row .val b { color: var(--text); font-size: 18px; font-weight: 800; }
  .track { grid-column: 1 / -1; position: relative; height: 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px; transition: width .8s var(--ease-out); }

  /* ---------- Meal ---------- */
  .meal-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: var(--surface-2); border: 1px solid var(--line); }
  .meal-head h3 { font-size: 22px; font-weight: 800; }
  .mk { text-align: right; }
  .mk b { display: block; font-size: 22px; font-weight: 900; font-stretch: 112%; letter-spacing: -.03em; color: var(--red); }
  .mk span { font-size: 12px; color: var(--text-3); }
  .opts { margin: 14px 0 4px; }
  .items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .item { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: rgba(255,255,255,.03); border: 1px solid transparent; transition: background-color .2s ease, opacity .2s ease; }
  .item.on { background: rgba(139, 92, 246, .14); border-color: rgba(205, 184, 255, .22); }
  .item.off { opacity: .62; }
  .item label { display: contents; cursor: pointer; }
  .item input[type=checkbox] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid rgba(255,255,255,.28); display: grid; place-items: center; transition: background-color .2s ease; cursor: pointer; }
  .box svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .3s var(--ease-out) .05s; }
  .item input:checked + .box { background: var(--grad); border-color: transparent; animation: pop .45s var(--spring); }
  .item input:checked + .box svg { stroke-dashoffset: 0; }
  .item input:focus-visible + .box { outline: 2px solid var(--lilac); outline-offset: 2px; }
  .ie { font-size: 24px; width: 30px; text-align: center; }
  .txt { min-width: 0; }
  .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .ms { font-size: 13px; color: var(--text-3); }
  .mac { text-align: right; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .mac b { display: block; font-size: 15px; color: var(--text); font-weight: 800; }
  .foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-right: auto; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.06); }
  .pill i { font-style: normal; color: var(--text-3); font-weight: 600; margin-right: 4px; }

  /* ---------- Lists (library, diets, editors) ---------- */
  .list { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0; }
  .li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
  .li.click { cursor: pointer; transition: transform .35s var(--spring), background-color .2s ease; text-align: left; width: 100%; }
  .li.click:active { transform: scale(.98); transition-duration: .1s; }
  .li.click:hover { background: rgba(255,255,255,.07); }
  .search { width: 100%; min-height: 48px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-size: 16px; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.06); border-radius: 999px; padding: 2px; }
  .stepper button { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; font-size: 18px; font-weight: 800; transition: transform .3s var(--spring); }
  .stepper button:active { transform: scale(.85); }
  .stepper span { min-width: 44px; text-align: center; font-weight: 800; font-size: 14px; }
  .tgt { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tgt div { padding: 10px; border-radius: var(--r-sm); background: rgba(255,255,255,.05); }
  .tgt b { display: block; font-size: 18px; font-weight: 800; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--grad); }

  /* ---------- Forms ---------- */
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .field input, .field select { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(255,255,255,.06); font-size: 16px; }
  .field select option { background: var(--sheet); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .emoji-row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: end; }
  .emoji-in { width: 76px !important; height: 64px; text-align: center; font-size: 34px !important; padding: 0 !important; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; max-height: 132px; overflow: auto; padding: 4px; border-radius: var(--r-sm); background: rgba(255,255,255,.04); }
  .emoji-grid button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 24px; cursor: pointer; transition: transform .3s var(--spring), background-color .15s ease; }
  .emoji-grid button:hover { background: rgba(255,255,255,.1); }
  .emoji-grid button:active { transform: scale(.85); }
  .check-row { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
  .check-row input { width: 22px; height: 22px; accent-color: var(--purple); }
  .seg { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.06); gap: 2px; flex-wrap: wrap; }
  .seg button { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 0; background: transparent; font-weight: 700; font-size: 14px; cursor: pointer; transition: background-color .2s ease, transform .3s var(--spring); }
  .seg button:active { transform: scale(.94); }
  .seg button[aria-pressed="true"] { background: var(--grad); }

  /* ---------- Charts ---------- */
  .chart { position: relative; width: 100%; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid line { stroke: rgba(255,255,255,.08); }
  .chart .axis text { fill: var(--text-3); font-size: 11px; font-family: var(--sans); }
  .chart .tline { stroke: var(--text-2); stroke-dasharray: 5 5; stroke-width: 1.5; }
  .chart .tlabel { fill: var(--text-2); font-size: 11px; font-weight: 700; font-family: var(--sans); }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .bar { transition: opacity .15s ease; }
  .chart .hover .bar { opacity: .75; }
  .tip { position: absolute; z-index: 5; pointer-events: none; padding: 8px 12px; border-radius: 12px; background: #1E1730; border: 1px solid var(--line); font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .tip b { display: block; font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 12px; border-radius: var(--r-sm); background: rgba(255,255,255,.05); }
  .stat b { display: block; font-size: 20px; font-weight: 900; font-stretch: 110%; letter-spacing: -.03em; }
  .stat .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }

  /* ---------- Calendar ---------- */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-3); padding-bottom: 2px; }
  .cell { aspect-ratio: 1 / 1.05; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 2px; transition: transform .3s var(--spring), background-color .2s ease; font-size: 13px; font-weight: 700; }
  .cell:active { transform: scale(.92); }
  .cell .ce { font-size: 16px; line-height: 1; }
  .cell.empty { visibility: hidden; }
  .cell.today { border-color: var(--lilac); box-shadow: 0 0 0 1px var(--lilac) inset; }
  .cell.l1 { background: rgba(139, 92, 246, .18); }
  .cell.l2 { background: rgba(139, 92, 246, .38); }
  .cell.l3 { background: var(--grad); border-color: transparent; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
  .week { display: grid; gap: 8px; }
  .week .wrow { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: rgba(255,255,255,.03); }

  /* ---------- Tab bar ---------- */
  .tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: rgba(12, 9, 18, .88); border-top: 1px solid var(--line); backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px); }
  .tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; border: 0; background: transparent; border-radius: 14px; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-3); transition: transform .3s var(--spring), background-color .2s ease, color .2s ease; }
  .tab .te { font-size: 22px; line-height: 1; }
  .tab:active { transform: scale(.9); }
  .tab[aria-current="page"] { color: var(--text); background: rgba(139, 92, 246, .22); }

  /* ---------- Sheet & toast ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4, 2, 8, .6); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 50; left: 50%; bottom: 0; width: min(640px, 100%); max-height: 90dvh; overflow: auto; transform: translate(-50%, 104%); transition: transform .45s var(--spring); background: var(--sheet); border: 1px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin: 0 auto 16px; }
  .sheet h3 { font-size: 24px; font-weight: 800; margin-bottom: 14px; }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 40px); opacity: 0; visibility: hidden; transition: transform .5s var(--spring), opacity .2s ease, visibility 0s linear .5s; padding: 12px 20px; border-radius: 999px; background: var(--grad); font-weight: 800; box-shadow: 0 12px 32px -12px rgba(255,59,92,.8); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform .5s var(--spring), opacity .2s ease, visibility 0s; }
  .sync { font-size: 12px; color: var(--text-3); margin-top: 16px; text-align: center; }

  @media (max-width: 640px) {
    .dash { grid-template-columns: 1fr; }
    .meal-head { grid-template-columns: auto 1fr; }
    .mk { grid-column: 1 / -1; text-align: left; display: flex; gap: 8px; align-items: baseline; }
    .mk b { display: inline; }
    .item { grid-template-columns: auto auto 1fr; }
    .item .mac { grid-column: 3; text-align: left; }
    .item .mac b { display: inline; margin-right: 6px; }
    .stats, .tgt { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .week .wrow { grid-template-columns: 1fr; }
    .li.edit { grid-template-columns: auto 1fr; }
    .li.edit > .row { grid-column: 1 / -1; justify-content: flex-end; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  /* ---------- v2: sections, dishes, stateful sheets ---------- */
  .sec-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .sec-head h3 { font-size: 22px; font-weight: 800; }
  .sec-add { width: 48px; height: 48px; border-radius: 16px; border: 0; background: var(--grad); font-size: 26px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 22px -10px rgba(255,59,92,.8); transition: transform .35s var(--spring); }
  .sec-add:active { transform: scale(.9); transition-duration: .1s; }
  .sec-kcal { font-size: 13px; color: var(--text-3); }
  .sec-kcal b { color: var(--red); font-size: 16px; font-weight: 900; }
  .dish { grid-template-columns: auto auto 1fr auto auto; }
  .dish .more { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; font-size: 18px; font-weight: 800; transition: transform .3s var(--spring); }
  .dish .more:active { transform: scale(.88); }
  .day-tag { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--lilac); margin-left: 6px; }
  .diet-fixed { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: var(--r-md); background: rgba(255,255,255,.05); margin-top: 14px; }
  .diet-fixed .e { font-size: 26px; }
  .choice { display: grid; gap: 10px; margin-top: 18px; }
  .choice .btn { min-height: 56px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 12px 18px; font-size: 16px; white-space: normal; text-align: left; border-radius: 18px; }
  .sheet.open ~ .toast { bottom: auto; top: calc(16px + env(safe-area-inset-top, 0px)); }
  .choice .btn small { display: block; font-weight: 500; font-size: 13px; opacity: .8; }
  .sum-box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .sum-box div { padding: 10px; border-radius: var(--r-sm); background: rgba(255,255,255,.05); text-align: center; }
  .sum-box b { display: block; font-size: 18px; font-weight: 900; }
  .sheet .sec-tabs { margin-bottom: 12px; }
  .ing { grid-template-columns: auto 1fr auto; }
  @media (max-width: 640px) {
    .dish { grid-template-columns: auto auto 1fr auto; }
    .dish .mac { grid-column: 3 / 4; grid-row: 2; text-align: left; white-space: normal; }
    .sum-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ing { grid-template-columns: auto 1fr; }
    .ing > .row { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <h1>Minha <span>Dieta</span> 💪</h1>
    <span class="muted" id="hdrDate"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <div class="sync" id="sync"></div>
</div>

<div class="tabbar"><nav aria-label="Seções">
  <button class="tab" data-tab="hoje" type="button"><span class="te">✅</span>Hoje</button>
  <button class="tab" data-tab="progresso" type="button"><span class="te">📊</span>Progresso</button>
  <button class="tab" data-tab="plano" type="button"><span class="te">🗓️</span>Plano</button>
  <button class="tab" data-tab="dietas" type="button"><span class="te">🍽️</span>Dietas</button>

</nav></div>

<div class="scrim" id="scrim"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // =====================================================================
  // Seed data: foods per portion (TACO / labels), recipes = dishes built from foods.
  // =====================================================================
  const F = (id, e, n, por, k, p, c, g, f) => ({ id, e, n, por, k, p, c, g, f });
  const SEED_FOODS = [
    F('pao', '🥖', 'Pão francês', '50 g · 1 unidade', 150, 4.0, 29.3, 1.6, 'TACO'),
    F('ovos2', '🍳', 'Ovos mexidos ou na chapa', '100 g · 2 unidades', 146, 13.3, 0.6, 9.5, 'TACO'),
    F('ovo', '🥚', 'Ovo', '50 g · 1 unidade', 73, 6.7, 0.3, 4.8, 'TACO'),
    F('azeite', '🫒', 'Azeite', '2 g · 1 fio', 18, 0.0, 0.0, 2.0, 'TACO'),
    F('farinha', '🥣', 'Farinha Láctea Nestlé', '30 g · 4 colheres de sopa rasas', 121, 3.9, 22.1, 1.9, 'Rótulo Nestlé'),
    F('leite', '🥛', 'Leite integral', '200 ml · 1 copo', 122, 5.8, 8.6, 6.4, 'TACO'),
    F('banana', '🍌', 'Banana prata', '70 g · 1 unidade média', 69, 0.9, 18.2, 0.1, 'TACO'),
    F('whey', '🥤', 'Whey protein concentrado*', '30 g · 1 scoop', 121, 24.0, 3.0, 1.5, 'Rótulo genérico (estimativa)'),
    F('paoforma', '🍞', 'Pão de forma tradicional*', '25 g · 1 fatia', 63, 2.2, 12.0, 0.6, 'Rótulo genérico (estimativa)'),
    F('nutella', '🍫', 'Nutella', '15 g · 1 colher de sobremesa rasa', 81, 0.9, 8.6, 4.6, 'Rótulo Ferrero'),
    F('amendoim', '🥜', 'Pasta de amendoim integral*', '15 g · 1 colher de sobremesa rasa', 88, 3.8, 3.0, 7.6, 'USDA (estimativa)'),
    F('ricota', '🧀', 'Creme de ricota light*', '30 g · 2 colheres de sopa rasas', 45, 2.7, 1.2, 3.3, 'Rótulo genérico (estimativa)'),
    F('sobrecoxa', '🍗', 'Sobrecoxa de frango assada', '80 g · 1 unidade média', 186, 23.4, 0.0, 9.6, 'TACO'),
    F('peito', '🍗', 'Peito de frango grelhado', '80 g · 1 filé pequeno', 127, 25.6, 0.0, 2.0, 'TACO'),
    F('arroz', '🍚', 'Arroz branco cozido', '100 g · 4 colheres de sopa cheias', 128, 2.5, 28.1, 0.2, 'TACO'),
    F('feijao', '🫘', 'Feijão carioca cozido', '90 g · 1 concha média', 68, 4.3, 12.2, 0.5, 'TACO'),
    F('macarrao', '🍝', 'Macarrão (peso cru)', '50 g · ≈ 1 xícara cozido', 186, 5.0, 39.0, 0.7, 'TACO'),
    F('extrato', '🍅', 'Extrato de tomate', '15 g · 1 colher de sopa', 9, 0.4, 2.3, 0.0, 'TACO'),
    F('legumes', '🥕', 'Mistura de legumes Swift', '60 g · 3 colheres de sopa', 34, 1.7, 6.6, 0.0, 'Rótulo Swift'),
    F('brocolis', '🥦', 'Brócolis cozido', '50 g · 3 ramos médios', 13, 1.1, 2.2, 0.3, 'TACO'),
    F('couveflor', '🥬', 'Couve-flor cozida', '50 g · 3 ramos médios', 10, 0.6, 2.0, 0.2, 'TACO')
  ];
  const ING = (s) => s.split(' ').map(x => { const [id, q] = x.split('*'); return { id, q: q ? +q : 1 }; });
  const R = (id, e, n, items) => ({ id, e, n, items: ING(items) });
  const SEED_RECIPES = [
    R('r-paomingau', '🥖', 'Pão com ovo + mingau', 'pao ovos2 azeite farinha leite banana'),
    R('r-paobanana', '🍳', 'Pão com ovo + banana', 'pao ovos2 banana'),
    R('r-posnutella', '🍫', 'Pós-treino com Nutella', 'whey paoforma nutella'),
    R('r-posamendoim', '🥜', 'Pós-treino com pasta de amendoim', 'whey paoforma amendoim'),
    R('r-posricota', '🧀', 'Pós-treino com creme de ricota', 'whey paoforma ricota'),
    R('r-frangoarroz', '🍗', 'Frango, arroz e feijão', 'sobrecoxa ovo arroz feijao legumes brocolis azeite'),
    R('r-macarrao', '🍝', 'Macarrão com frango', 'peito macarrao extrato ovo legumes brocolis azeite'),
    R('r-shake', '🥤', 'Shake de whey', 'whey'),
    R('r-peitoarroz', '🍗', 'Peito, arroz e feijão', 'peito arroz feijao legumes brocolis azeite'),
    R('r-peitolegumes', '🥗', 'Frango com feijão e legumes', 'peito feijao legumes brocolis azeite')
  ];
  let U = 0; const uid = (p) => p + Date.now().toString(36).slice(-4) + (U++).toString(36) + Math.random().toString(36).slice(2, 5);
  const dish = (id, q) => ({ u: uid('u'), t: 'r', id, q: q || 1 });
  const MEAL = (id, e, name, dishes) => ({ id, e, name, dishes: dishes.map(x => dish(x)) });
  const SEED_DIETS = () => [
    { id: 'bulking', e: '💪', name: 'Bulking', created: '2000-01-01', note: 'Plano de referência (ganho de massa).', target: { k: 2050, p: 158.2, c: 204.3, g: 64.1 }, meals: [
      MEAL('cafe', '🍳', 'Café da manhã', ['r-paomingau']), MEAL('pos', '🏋️', 'Pós-treino', ['r-posnutella']), MEAL('almoco', '🍛', 'Almoço', ['r-frangoarroz']),
      MEAL('lanche', '🥤', 'Lanche da tarde', ['r-shake']), MEAL('jantar', '🌙', 'Jantar', ['r-frangoarroz'])] },
    { id: 'cutting', e: '🔥', name: 'Cutting', created: '2000-01-01', note: 'Modelo para ajustar com a nutricionista.', target: { k: 1360, p: 139, c: 137, g: 28 }, meals: [
      MEAL('cafe', '🍳', 'Café da manhã', ['r-paobanana']), MEAL('pos', '🏋️', 'Pós-treino', ['r-posricota']), MEAL('almoco', '🍛', 'Almoço', ['r-peitoarroz']),
      MEAL('lanche', '🥤', 'Lanche da tarde', ['r-shake']), MEAL('jantar', '🌙', 'Jantar', ['r-peitolegumes'])] }
  ];
  const FOOD_EMOJI = '🥖 🍞 🥐 🥯 🧇 🥞 🍳 🥚 🧀 🥛 🥣 🍌 🍎 🍐 🍊 🍋 🍉 🍇 🍓 🫐 🍍 🥭 🥝 🍑 🥥 🥑 🍅 🥕 🌽 🥦 🥬 🥒 🫑 🧅 🧄 🥔 🍠 🫘 🥜 🌰 🍚 🍝 🍜 🍲 🍛 🥗 🍗 🍖 🥩 🥓 🍔 🌭 🌮 🌯 🥙 🍕 🐟 🍣 🍤 🦐 🥟 🫓 🥪 🍿 🍫 🍪 🍩 🍰 🧁 🍯 🫒 🧈 🥤 🧃 ☕ 🍵 💧 🏋️ 🌙 ☀️ 🌅 🔥 💪 ⚡'.split(' ');

  // =====================================================================
  // State + migration from v1 (options per meal) to v2 (dishes = recipes)
  // =====================================================================
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const LS1 = 'minha-dieta-v1', LS = 'minha-dieta-v2';
  const freshConfig = () => ({ v: 2, foods: clone(SEED_FOODS), recipes: clone(SEED_RECIPES), diets: SEED_DIETS(), def: 'bulking', week: {}, dayDiet: {} });
  function migrate(old) {
    const c = { v: 2, foods: old.lib || clone(SEED_FOODS), recipes: [], diets: [], def: old.def || 'bulking', week: old.week || {}, dayDiet: old.dayDiet || {} };
    const sig = (items) => items.map(i => i.id + '*' + i.q).join(' ');
    const recFor = (o) => {
      const items = (o.items || []).map(i => ({ id: i.lib, q: i.q || 1 }));
      let r = c.recipes.find(x => x.n === o.name && sig(x.items) === sig(items));
      if (!r) { r = { id: uid('r'), e: o.e || '🍽️', n: o.name || 'Prato', items }; c.recipes.push(r); }
      return r.id;
    };
    c.diets = (old.diets || []).map(d => ({ id: d.id, e: d.e, name: d.name, note: d.note || '', target: d.target, created: '2000-01-01',
      meals: (d.meals || []).map(m => { const ids = (m.opts || []).map(recFor); return { id: m.id, e: m.e, name: m.name, dishes: ids.length ? [dish(ids[0])] : [] }; }) }));
    if (!c.diets.length) c.diets = SEED_DIETS();
    SEED_RECIPES.forEach(r => { if (!c.recipes.some(x => x.n === r.n)) c.recipes.push(clone(r)); });
    return c;
  }
  const migrateLogs = (lg) => { const out = {}; Object.keys(lg || {}).forEach(k => { const x = lg[k]; out[k] = { diet: x.diet, chk: {}, tot: x.tot, tgt: x.tgt, done: x.done, of: x.of }; }); return out; };
  let cfg = freshConfig(), logs = {};
  try {
    const s2 = JSON.parse(localStorage.getItem(LS) || 'null');
    const s1 = s2 ? null : JSON.parse(localStorage.getItem(LS1) || 'null');
    if (s2 && s2.cfg && s2.cfg.v === 2) { cfg = s2.cfg; logs = s2.logs || {}; }
    else if (s1 && s1.cfg) { cfg = migrate(s1.cfg); logs = migrateLogs(s1.logs); }
  } catch (e) {}

  const ui = { tab: 'hoje', date: null, prog: 'semana', metric: 'k', planMonth: null, libTab: 'r', libQ: '', draft: null };

  // ---------- dates & format ----------
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  ui.date = todayKey(); ui.planMonth = ui.date.slice(0, 7);
  const WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const WD_LONG = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const fmtDay = (k, opt) => parseKey(k).toLocaleDateString('pt-BR', opt || { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, s => s.toUpperCase());
  const f0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  const f1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const kc = (v) => f0.format(Math.round(v || 0));
  const gr = (v) => f1.format(Math.round((v || 0) * 10) / 10);
  const qf = (q) => (q === 1 ? '' : (Number.isInteger(q) ? q : f1.format(q)) + '× ');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const numIn = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };
  const firstGrapheme = (s) => { s = String(s || '').trim(); if (!s) return ''; try { return [...new Intl.Segmenter('pt', { granularity: 'grapheme' }).segment(s)].pop().segment; } catch (e) { return Array.from(s).slice(-1)[0]; } };

  // ---------- model ----------
  const Z = [0, 0, 0, 0];
  const sum = (arr) => arr.reduce((a, x) => [a[0] + x[0], a[1] + x[1], a[2] + x[2], a[3] + x[3]], [0, 0, 0, 0]);
  const scale = (v, q) => v.map(x => x * q);
  const food = (id) => cfg.foods.find(x => x.id === id);
  const recipe = (id) => cfg.recipes.find(x => x.id === id);
  const foodVal = (f) => f ? [f.k, f.p, f.c, f.g] : Z;
  const recipeVal = (r) => r ? sum(r.items.map(i => scale(foodVal(food(i.id)), i.q))) : Z;
  const entryVal = (e) => scale(e.t === 'r' ? recipeVal(recipe(e.id)) : foodVal(food(e.id)), e.q || 1);
  const entryInfo = (e) => {
    if (e.t === 'r') { const r = recipe(e.id); if (!r) return { e: '❔', n: 'Receita excluída', sub: '' }; return { e: r.e, n: r.n, sub: r.items.map(i => { const f = food(i.id); return f ? qf(i.q) + f.n.replace('*', '') : ''; }).filter(Boolean).join(', ') }; }
    const f = food(e.id); return f ? { e: f.e, n: f.n, sub: f.por } : { e: '❔', n: 'Alimento excluído', sub: '' };
  };
  const diet = (id) => cfg.diets.find(x => x.id === id) || cfg.diets[0];
  const plannedDietId = (k) => { const id = cfg.dayDiet[k] || cfg.week[parseKey(k).getDay()] || cfg.def; return cfg.diets.some(d => d.id === id) ? id : cfg.def; };
  const dietFor = (k) => (k < todayKey() && logs[k] && logs[k].diet && cfg.diets.some(d => d.id === logs[k].diet)) ? diet(logs[k].diet) : diet(plannedDietId(k));
  const dietPlanned = (d) => sum(d.meals.map(m => sum(m.dishes.map(entryVal))));

  function dayLog(k, create) {
    if (!logs[k] && create) logs[k] = { diet: dietFor(k).id, chk: {} };
    return logs[k];
  }
  // meals for a day: the diet's meals, or this day's own copy after a "só hoje" change
  function dayMeals(k) {
    const lg = logs[k], d = dietFor(k);
    if (lg && lg.meals && lg.mealsFrom === d.id) return lg.meals;
    return d.meals;
  }
  const isOverridden = (k) => { const lg = logs[k]; return !!(lg && lg.meals && lg.mealsFrom === dietFor(k).id); };
  function ensureOverride(k) { const lg = dayLog(k, true), d = dietFor(k); if (!(lg.meals && lg.mealsFrom === d.id)) { lg.meals = clone(d.meals); lg.mealsFrom = d.id; } return lg.meals; }
  const ckey = (m, e) => m.id + ':' + e.u;

  function mealNow(k, m) {
    const lg = logs[k]; let now = [0, 0, 0, 0], n = 0;
    m.dishes.forEach(e => { if (lg && lg.chk[ckey(m, e)]) { n++; now = sum([now, entryVal(e)]); } });
    return { now, plan: sum(m.dishes.map(entryVal)), n, of: m.dishes.length, all: n === m.dishes.length && n > 0 };
  }
  function dayTotals(k) {
    const d = dietFor(k), meals = dayMeals(k).map(m => mealNow(k, m));
    return { now: sum(meals.map(x => x.now)), tgt: [d.target.k, d.target.p, d.target.c, d.target.g], meals, done: meals.filter(x => x.all).length, total: meals.length };
  }
  function stamp(k) { const lg = logs[k]; if (!lg) return; const t = dayTotals(k); lg.diet = dietFor(k).id; lg.tot = t.now; lg.tgt = t.tgt; lg.done = t.done; lg.of = t.total; }

  // "Todos os dias": change the diet itself. A diet created before today is kept as it is and a new
  // version ("Cutting 2") takes its place in the plan from today on.
  function nextName(name) {
    const base = name.replace(/\s+\d+$/, '');
    let max = 1; cfg.diets.forEach(d => { const m = d.name.match(/^(.*?)\s+(\d+)$/); if ((m ? m[1] : d.name) === base) max = Math.max(max, m ? +m[2] : 1); });
    return base + ' ' + (max + 1);
  }
  function retarget(oldId, newId) {
    const t = todayKey();
    if (cfg.def === oldId) cfg.def = newId;
    Object.keys(cfg.week).forEach(w => { if (cfg.week[w] === oldId) cfg.week[w] = newId; });
    Object.keys(cfg.dayDiet).forEach(k => { if (k >= t && cfg.dayDiet[k] === oldId) cfg.dayDiet[k] = newId; });
    Object.keys(logs).forEach(k => { const lg = logs[k]; if (k >= t && lg.diet === oldId) { lg.diet = newId; if (lg.mealsFrom === oldId) lg.mealsFrom = newId; } });
  }
  function changeDietEveryDay(k, mutate) {
    const d0 = dietFor(k), t = todayKey(); let d = d0, created = false;
    if (d0.created !== t) {
      d = clone(d0); d.id = uid('d'); d.name = nextName(d0.name); d.created = t; d.from = d0.id; cfg.diets.push(d);
      retarget(d0.id, d.id); created = true;   // today and future days now use the new version
    }
    mutate(d.meals);
    const lg = logs[k]; if (lg && lg.meals && lg.mealsFrom === d.id) mutate(lg.meals);
    persist('cfg');
    return { d, created, from: d0 };
  }
  const findMeal = (meals, id) => meals.find(m => m.id === id);

  // =====================================================================
  // Persistence: localStorage now; private db docs when available.
  // =====================================================================
  let db = null, base = null, dirtyCfg = false, dirtyMonths = new Set(), saving = false, saveT;
  function persist(kind, k) {
    try { localStorage.setItem(LS, JSON.stringify({ cfg, logs })); } catch (e) {}
    if (kind === 'cfg') dirtyCfg = true;
    if (kind === 'log') dirtyMonths.add(k.slice(0, 7));
    if (db) { clearTimeout(saveT); saveT = setTimeout(flush, 800); }
  }
  async function flush() {
    if (!db || saving) return;
    saving = true;
    try {
      while (dirtyCfg || dirtyMonths.size) {
        if (dirtyCfg) { dirtyCfg = false; await db.doc(base + '/config').set({ cfg: JSON.stringify(cfg), updatedAt: new Date().toISOString() }); }
        const m = [...dirtyMonths][0];
        if (m) { dirtyMonths.delete(m); const days = {}; Object.keys(logs).filter(k => k.startsWith(m)).forEach(k => { days[k] = logs[k]; }); await db.doc(base + '/log-' + m).set({ days: JSON.stringify(days), updatedAt: new Date().toISOString() }); }
      }
      setSync('☁️ Salvo na sua conta');
    } catch (e) { setSync('Não deu para salvar na conta agora; ficou salvo neste aparelho.'); }
    saving = false;
  }
  const setSync = (t) => { const el = document.getElementById('sync'); if (el) el.textContent = t; };
  async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('Salvo neste aparelho.'); return; }
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u) { setSync('Salvo neste aparelho.'); return; }
    let id; try { id = await u.id(); } catch (e) { return; }
    if (!id) return;
    base = 'data/users/' + id;
    const timer = setTimeout(() => setSync('Conta demorando a responder; salvando neste aparelho.'), 10000);
    try {
      const months = [ui.date.slice(0, 7), addDays(ui.date.slice(0, 7) + '-01', -1).slice(0, 7)];
      const [c, ...ms] = await Promise.all([d.doc(base + '/config').get()].concat(months.map(m => d.doc(base + '/log-' + m).get())));
      clearTimeout(timer);
      let wasV1 = false;
      if (c.exists) { try { const v = JSON.parse(c.data().cfg); if (v && v.v === 2) cfg = v; else if (v && v.lib) { cfg = migrate(v); wasV1 = true; dirtyCfg = true; } } catch (e) {} } else dirtyCfg = true;
      ms.forEach((s, i) => { if (s.exists) { try { const days = JSON.parse(s.data().days); Object.assign(logs, wasV1 ? migrateLogs(days) : days); if (wasV1) dirtyMonths.add(months[i]); } catch (e) {} } else if (Object.keys(logs).some(k => k.startsWith(months[i]))) dirtyMonths.add(months[i]); });
      db = d; render(); setSync('☁️ Sincronizado com a sua conta');
      try { localStorage.setItem(LS, JSON.stringify({ cfg, logs })); } catch (e) {}
      if (dirtyCfg || dirtyMonths.size) flush();
    } catch (e) { clearTimeout(timer); setSync('Salvando só neste aparelho.'); }
  }

  // =====================================================================
  // Views
  // =====================================================================
  const $ = (id) => document.getElementById(id);
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pills = (v) => `<div class="pills num"><span class="pill" style="color:var(--s-k)"><i>kcal</i>${kc(v[0])}</span><span class="pill" style="color:#B9A6F5"><i>P</i>${gr(v[1])} g</span><span class="pill" style="color:#A88BFF"><i>C</i>${gr(v[2])} g</span><span class="pill" style="color:#F07AB4"><i>G</i>${gr(v[3])} g</span></div>`;
  const sumBox = (v) => `<div class="sum-box num"><div><span class="label">kcal</span><b style="color:var(--s-k)">${kc(v[0])}</b></div><div><span class="label">Proteína</span><b>${gr(v[1])} g</b></div><div><span class="label">Carbo</span><b>${gr(v[2])} g</b></div><div><span class="label">Gordura</span><b>${gr(v[3])} g</b></div></div>`;

  function dashHtml(now, tgt) {
    const C = 326.73, pct = tgt[0] ? Math.min(now[0] / tgt[0], 1) : 0;
    const row = (label, i, color) => { const max = Math.max(tgt[i], now[i]) || 1; return `<div class="bar-row"><span class="name">${label}</span><span class="val num"><b>${gr(now[i])}</b> / ${gr(tgt[i])} g</span><div class="track"><div class="fill" style="background:${color};width:${now[i] / max * 100}%"></div></div></div>`; };
    return `<div class="dash"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3B5C"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/><circle class="fg" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <div class="center"><span class="label">🔥 Calorias</span><span class="big num">${kc(now[0])}</span><span class="of num">de ${kc(tgt[0])} kcal (meta)</span></div></div>
      <div class="bars">${row('💪 Proteína', 1, 'var(--s-p)')}${row('⚡ Carboidrato', 2, 'var(--s-c)')}${row('🥑 Gordura', 3, 'var(--s-g)')}</div></div>`;
  }

  // ---------- HOJE ----------
  function viewHoje() {
    const k = ui.date, d = dietFor(k), lg = logs[k], t = dayTotals(k), meals = dayMeals(k);
    const isToday = k === todayKey(), past = k < todayKey();
    let h = `<div class="stack">
      <div class="card"><div class="daynav"><button class="btn icon" data-act="day" data-n="-1" aria-label="Dia anterior">‹</button><div class="d"><b>${isToday ? 'Hoje' : esc(fmtDay(k, { weekday: 'long' }))}</b><span class="muted">${esc(fmtDay(k, { day: 'numeric', month: 'long', year: 'numeric' }))}</span></div><button class="btn icon" data-act="day" data-n="1" aria-label="Próximo dia">›</button></div>
      <div class="diet-fixed"><span class="e" aria-hidden="true">${esc(d.e)}</span><div class="grow"><b>${esc(d.name)}</b><br><span class="muted">${past ? 'Dieta usada neste dia' : 'Dieta do dia, definida no Plano'}${isOverridden(k) ? ' · com mudanças só deste dia' : ''}</span></div>${past ? '' : '<button class="btn small" data-act="goplan">🗓️ Plano</button>'}</div>
      ${isToday ? '' : '<div style="margin-top:12px"><button class="btn small" data-act="today">📍 Ir para hoje</button></div>'}</div>
      <div class="card">${dashHtml(t.now, t.tgt)}<div class="row between" style="margin-top:14px"><span class="label num">${t.done}/${t.total} refeições completas</span></div></div>`;
    meals.forEach(m => {
      const mt = mealNow(k, m);
      h += `<section class="card" aria-label="${esc(m.name)}"><div class="sec-head"><div class="badge" aria-hidden="true">${esc(m.e)}</div><div><h3>${esc(m.name)}</h3><span class="sec-kcal num"><b>${kc(mt.now[0])}</b> de ${kc(mt.plan[0])} kcal · ${mt.n}/${mt.of} pratos</span></div><button class="sec-add" type="button" data-act="addto" data-meal="${m.id}" aria-label="Adicionar em ${esc(m.name)}">+</button></div>`;
      h += `<ul class="items">${m.dishes.map(e => { const inf = entryInfo(e), v = entryVal(e), key = ckey(m, e), on = !!(lg && lg.chk[key]); const idd = 'c-' + key.replace(/[^a-z0-9]/gi, '_');
        return `<li class="item dish ${on ? 'on' : 'off'}"><label for="${idd}"><input type="checkbox" id="${idd}" data-act="check" data-meal="${m.id}" data-u="${e.u}"${on ? ' checked' : ''}><span class="box" aria-hidden="true">${CHECK}</span><span class="ie" aria-hidden="true">${esc(inf.e)}</span><span class="txt"><span class="nm">${esc(qf(e.q) + inf.n)}${e.today ? '<span class="day-tag">só hoje</span>' : ''}</span><br><span class="ms">${esc(inf.sub)}</span></span></label><span class="mac num"><b>${kc(v[0])} kcal</b>P ${gr(v[1])} · C ${gr(v[2])} · G ${gr(v[3])}</span><button type="button" class="more" data-act="dishmenu" data-meal="${m.id}" data-u="${e.u}" aria-label="Opções de ${esc(inf.n)}">⋯</button></li>`; }).join('') || `<li class="muted">Nenhum prato ainda. Toque em <b>+</b> para adicionar.</li>`}</ul>`;
      h += `<div class="foot">${pills(mt.now)}${m.dishes.length ? `<button type="button" class="btn small ${mt.all ? '' : 'primary'}" data-act="all" data-meal="${m.id}">${mt.all ? '↩️ Desmarcar' : '✅ Comi tudo'}</button>` : ''}</div></section>`;
    });
    h += `<button class="btn block" data-act="newmealday">➕ Nova refeição neste dia</button></div>`;
    return h;
  }

  // ---------- PROGRESSO ----------
  const METRICS = { k: ['🔥 Calorias', 'kcal', 'var(--s-k)', 0], p: ['💪 Proteína', 'g', 'var(--s-p)', 1], c: ['⚡ Carboidrato', 'g', 'var(--s-c)', 2], g: ['🥑 Gordura', 'g', 'var(--s-g)', 3] };
  function seriesFor(keys) {
    return keys.map(k => { const lg = logs[k]; const has = lg && lg.tot && (lg.tot[0] > 0); const tgt = lg && lg.tgt ? lg.tgt : (() => { const t = diet(plannedDietId(k)).target; return [t.k, t.p, t.c, t.g]; })(); return { k, v: has ? lg.tot : null, tgt }; });
  }
  function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function barChart(points, labels, mi, title) {
    const [mname, unit, color, idx] = METRICS[mi];
    const narrow = window.innerWidth < 640;
    const W = narrow ? 380 : 700, H = narrow ? 240 : 260, padL = 40, padR = 8, padT = 16, padB = 26;
    const vals = points.map(p => p.v ? p.v[idx] : 0), tg = points.map(p => p.tgt[idx]);
    const max = Math.max(1, ...vals, ...tg) * 1.12;
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const y = (v) => padT + (H - padT - padB) * (1 - v / top);
    const bw = (W - padL - padR) / points.length, barW = Math.max(4, Math.min(36, bw - 6));
    let g = '<g class="grid">';
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>`;
    g += '</g><g class="axis">';
    for (let v = 0; v <= top + 1e-9; v += step) g += `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${unit === 'kcal' ? kc(v) : f0.format(v)}</text>`;
    points.forEach((p, i) => { if (labels[i]) g += `<text x="${padL + bw * i + bw / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`; });
    g += '</g>';
    const avgT = tg.reduce((a, b) => a + b, 0) / tg.length;
    g += `<line class="tline" x1="${padL}" x2="${W - padR}" y1="${y(avgT)}" y2="${y(avgT)}"/><text class="tlabel" x="${W - padR}" y="${y(avgT) - 6}" text-anchor="end">meta ${unit === 'kcal' ? kc(avgT) : gr(avgT)} ${unit}</text>`;
    points.forEach((p, i) => {
      const v = vals[i], x = padL + bw * i + (bw - barW) / 2, yy = y(v), hh = Math.max(0, y(0) - yy);
      if (v > 0) { const r = Math.min(4, barW / 2, hh); g += `<path class="bar" d="M${x},${y(0)} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + barW - r} Q${x + barW},${yy} ${x + barW},${yy + r} V${y(0)} Z" fill="${color}"/>`; }
      g += `<rect class="hit" x="${padL + bw * i}" y="${padT}" width="${bw}" height="${H - padT - padB}" data-tip="${i}"/>`;
    });
    const tips = points.map((p, i) => { const v = vals[i]; const pct = p.tgt[idx] ? Math.round(v / p.tgt[idx] * 100) : 0; return `${esc(fmtDay(p.k, { weekday: 'short', day: 'numeric', month: 'short' }))}|${p.v ? (unit === 'kcal' ? kc(v) : gr(v)) + ' ' + unit + ' · ' + pct + '% da meta' : 'Sem registro'}`; });
    return `<div class="chart" data-tips="${esc(JSON.stringify(tips))}" role="img" aria-label="${esc(title + ': ' + mname)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
  }
  function statsHtml(points) {
    const logged = points.filter(p => p.v);
    const avg = (i) => logged.length ? logged.reduce((a, p) => a + p.v[i], 0) / logged.length : 0;
    const hit = logged.filter(p => p.v[0] >= p.tgt[0] * .9 && p.v[0] <= p.tgt[0] * 1.1).length;
    return `<div class="stats num"><div class="stat"><span class="label"><span class="sw" style="background:var(--s-k)"></span>kcal/dia</span><b>${kc(avg(0))}</b></div><div class="stat"><span class="label"><span class="sw" style="background:var(--s-p)"></span>Proteína</span><b>${gr(avg(1))} g</b></div><div class="stat"><span class="label"><span class="sw" style="background:var(--s-c)"></span>Carbo</span><b>${gr(avg(2))} g</b></div><div class="stat"><span class="label"><span class="sw" style="background:var(--s-g)"></span>Gordura</span><b>${gr(avg(3))} g</b></div></div>
      <p class="muted" style="margin-top:10px">Médias dos ${logged.length} dia(s) com registro · ${hit} dia(s) dentro da meta de calorias (±10%).</p>`;
  }
  function weekKeys(k) { const d = parseKey(k); const dow = (d.getDay() + 6) % 7; const mon = addDays(k, -dow); return Array.from({ length: 7 }, (_, i) => addDays(mon, i)); }
  function monthKeys(m) { const [y, mo] = m.split('-').map(Number); const n = new Date(y, mo, 0).getDate(); return Array.from({ length: n }, (_, i) => m + '-' + pad(i + 1)); }
  function calendarHtml(m, act) {
    const keys = monthKeys(m), first = (parseKey(keys[0]).getDay() + 6) % 7, today = todayKey();
    let h = `<div class="cal">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(w => `<span class="wd">${w}</span>`).join('')}`;
    for (let i = 0; i < first; i++) h += '<span class="cell empty" aria-hidden="true"></span>';
    keys.forEach(k => {
      const lg = logs[k]; const pct = lg && lg.tgt && lg.tot ? lg.tot[0] / lg.tgt[0] : 0;
      const lv = !lg || !lg.tot || !lg.tot[0] ? '' : pct >= .9 ? 'l3' : pct >= .5 ? 'l2' : 'l1';
      const de = dietFor(k).e;
      h += `<button type="button" class="cell ${lv}${k === today ? ' today' : ''}" data-act="${act}" data-k="${k}" aria-label="${esc(fmtDay(k))}${lv ? ', ' + Math.round(pct * 100) + '% da meta' : ''}"><span class="ce" aria-hidden="true">${lv === 'l3' ? '✅' : esc(de)}</span><span class="num">${Number(k.slice(8))}</span></button>`;
    });
    return h + '</div><div class="legend" style="margin-top:12px"><span><i style="background:rgba(139,92,246,.18)"></i>até 50%</span><span><i style="background:rgba(139,92,246,.38)"></i>50–90%</span><span><i style="background:var(--grad)"></i>✅ 90% ou mais da meta</span></div>';
  }
  function viewProgresso() {
    const segP = [['dia', 'Dia'], ['semana', 'Semana'], ['mes', 'Mês']].map(([id, n]) => `<button type="button" data-act="prog" data-id="${id}" aria-pressed="${ui.prog === id}">${n}</button>`).join('');
    const segM = Object.keys(METRICS).map(id => `<button type="button" data-act="metric" data-id="${id}" aria-pressed="${ui.metric === id}">${METRICS[id][0]}</button>`).join('');
    let h = `<h2 class="view-title">📊 Progresso</h2><div class="stack"><div class="row"><div class="seg" role="group" aria-label="Período">${segP}</div></div>`;
    if (ui.prog === 'dia') {
      const k = ui.date, t = dayTotals(k), d = dietFor(k), meals = dayMeals(k);
      return h + `<div class="card"><div class="row between" style="margin-bottom:12px"><b>${esc(fmtDay(k))}</b><span class="muted">${esc(d.e + ' ' + d.name)}</span></div>${dashHtml(t.now, t.tgt)}</div>
        <div class="card"><h3 style="font-size:20px;margin-bottom:12px">Por refeição</h3><ul class="list">${meals.map((m, i) => `<li class="li"><span class="ie">${esc(m.e)}</span><span class="txt"><span class="nm">${esc(m.name)}</span><br><span class="ms num">P ${gr(t.meals[i].now[1])} · C ${gr(t.meals[i].now[2])} · G ${gr(t.meals[i].now[3])}</span></span><span class="mac num"><b>${kc(t.meals[i].now[0])} kcal</b>${t.meals[i].all ? '✅ completa' : t.meals[i].n + '/' + t.meals[i].of}</span></li>`).join('')}</ul></div></div>`;
    }
    const keys = ui.prog === 'semana' ? weekKeys(ui.date) : monthKeys(ui.date.slice(0, 7));
    const pts = seriesFor(keys);
    const labels = ui.prog === 'semana' ? keys.map(k => WD[parseKey(k).getDay()]) : keys.map((k, i) => (i % 5 === 0 || i === keys.length - 1) ? String(i + 1) : '');
    const title = ui.prog === 'semana' ? 'Semana de ' + fmtDay(keys[0], { day: 'numeric', month: 'short' }) + ' a ' + fmtDay(keys[6], { day: 'numeric', month: 'short' }) : fmtDay(keys[0], { month: 'long', year: 'numeric' });
    h += `<div class="card"><div class="row" style="margin-bottom:12px"><button class="btn icon" data-act="pnav" data-n="-1" aria-label="Período anterior">‹</button><b>${esc(title)}</b><button class="btn icon" data-act="pnav" data-n="1" aria-label="Próximo período">›</button></div>
      <div class="seg" role="group" aria-label="Medida" style="margin-bottom:14px">${segM}</div>${barChart(pts, labels, ui.metric, title)}<p class="muted" style="margin-top:8px">Toque numa barra para ver o valor do dia. A linha tracejada é a meta da dieta.</p></div>
      <div class="card">${statsHtml(pts)}</div>`;
    if (ui.prog === 'mes') h += `<div class="card"><h3 style="font-size:20px;margin-bottom:12px">✅ Checklist do mês</h3>${calendarHtml(ui.date.slice(0, 7), 'openday')}</div>`;
    else h += `<div class="card"><h3 style="font-size:20px;margin-bottom:12px">✅ Checklist da semana</h3><div class="week">${keys.map(k => { const lg = logs[k]; const pct = lg && lg.tgt && lg.tot ? Math.round(lg.tot[0] / lg.tgt[0] * 100) : 0; const dd = dietFor(k); return `<button type="button" class="li click" data-act="openday" data-k="${k}"><span class="ie">${lg && lg.of && lg.done === lg.of ? '✅' : lg && lg.tot && lg.tot[0] ? '🟣' : '⚪'}</span><span class="txt"><span class="nm">${esc(fmtDay(k, { weekday: 'long', day: 'numeric' }))}</span><br><span class="ms">${esc(dd.e + ' ' + dd.name)}${lg && lg.of ? ' · ' + (lg.done || 0) + '/' + lg.of + ' refeições' : ''}</span></span><span class="mac num"><b>${lg && lg.tot ? kc(lg.tot[0]) : '–'} kcal</b>${pct ? pct + '% da meta' : 'sem registro'}</span></button>`; }).join('')}</div></div>`;
    return h + '</div>';
  }

  // ---------- PLANO ----------
  function viewPlano() {
    let h = `<h2 class="view-title">🗓️ Planejamento</h2><div class="stack"><div class="card"><h3 style="font-size:20px">Semana</h3><p class="muted" style="margin:4px 0 14px">A dieta de cada dia vem daqui. Na tela Hoje ela já aparece pronta.</p><div class="week">`;
    [1, 2, 3, 4, 5, 6, 0].forEach(w => {
      const cur = cfg.week[w] && cfg.diets.some(d => d.id === cfg.week[w]) ? cfg.week[w] : cfg.def;
      h += `<div class="wrow"><b>${WD_LONG[w]}</b><div class="chips">${cfg.diets.map(d => `<button type="button" class="chip" data-act="weekdiet" data-w="${w}" data-id="${d.id}" aria-pressed="${d.id === cur}"><span class="e">${esc(d.e)}</span>${esc(d.name)}</button>`).join('')}</div></div>`;
    });
    const m = ui.planMonth;
    h += `</div></div><div class="card"><div class="row between" style="margin-bottom:12px"><h3 style="font-size:20px">Mês</h3><div class="row"><button class="btn icon" data-act="mnav" data-n="-1" aria-label="Mês anterior">‹</button><b>${esc(fmtDay(m + '-01', { month: 'long', year: 'numeric' }))}</b><button class="btn icon" data-act="mnav" data-n="1" aria-label="Próximo mês">›</button></div></div>
      <p class="muted" style="margin-bottom:12px">Toque num dia para trocar a dieta só daquele dia ou abrir o checklist. O emoji mostra a dieta do dia.</p>${calendarHtml(m, 'planday')}</div></div>`;
    return h;
  }

  // ---------- DIETAS (editor works on a draft; saving asks: new version or replace) ----------
  function viewDietas() {
    if (ui.draft) return viewDraft();
    let h = `<div class="row between"><h2 class="view-title">🍽️ Minhas dietas</h2><button class="btn primary small" data-act="newdiet">➕ Nova dieta</button></div><div class="stack">`;
    cfg.diets.forEach(d => {
      const pl = dietPlanned(d);
      h += `<div class="card"><div class="meal-head"><div class="badge" aria-hidden="true">${esc(d.e)}</div><div><h3>${esc(d.name)} ${d.id === cfg.def ? '<span class="tag">padrão</span>' : ''}</h3><span class="muted">${d.meals.length} refeições${d.from ? ' · nova versão de ' + esc(diet(d.from).id === d.from ? diet(d.from).name : 'outra dieta') : ''}${d.note ? ' · ' + esc(d.note) : ''}</span></div></div>
        <div class="tgt num" style="margin-top:14px"><div><span class="label">Meta kcal</span><b>${kc(d.target.k)}</b></div><div><span class="label">Proteína</span><b>${gr(d.target.p)} g</b></div><div><span class="label">Carbo</span><b>${gr(d.target.c)} g</b></div><div><span class="label">Gordura</span><b>${gr(d.target.g)} g</b></div></div>
        <p class="muted num" style="margin-top:10px">Pratos da dieta somam: ${kc(pl[0])} kcal · P ${gr(pl[1])} · C ${gr(pl[2])} · G ${gr(pl[3])}</p>
        <div class="foot"><button class="btn small primary" data-act="editdiet" data-id="${d.id}">✏️ Editar</button><button class="btn small" data-act="dupdiet" data-id="${d.id}">📄 Duplicar</button>${d.id === cfg.def ? '' : `<button class="btn small" data-act="defdiet" data-id="${d.id}">⭐ Padrão</button>`}${cfg.diets.length > 1 ? `<button class="btn small danger" data-act="deldiet" data-id="${d.id}">🗑️ Excluir</button>` : ''}</div></div>`;
    });
    return h + '</div>';
  }
  function viewDraft() {
    const dr = ui.draft, d = dr.d, pl = dietPlanned(d);
    let h = `<div class="row between" style="margin-bottom:6px"><button class="btn small ghost" data-act="draftcancel">‹ Voltar</button><span class="muted">${dr.base ? 'Editando' : 'Nova dieta'}${dr.changed ? ' · alterações não salvas' : ''}</span></div>
      <div class="card"><div class="meal-head"><button class="badge" data-act="draftmeta" style="cursor:pointer" aria-label="Nome, emoji e metas">${esc(d.e)}</button><div><h3>${esc(d.name)}</h3><span class="muted num">Meta: ${kc(d.target.k)} kcal · P ${gr(d.target.p)} · C ${gr(d.target.c)} · G ${gr(d.target.g)}</span></div><button class="btn small" data-act="draftmeta">✏️ Nome e metas</button></div>
      ${sumBox(pl)}<p class="muted" style="margin-top:8px">Soma dos pratos abaixo. <button class="btn small ghost" data-act="draftmetafromdishes">🎯 Usar como meta</button></p></div><div class="stack" style="margin-top:16px">`;
    d.meals.forEach((m, mi) => {
      const mv = sum(m.dishes.map(entryVal));
      h += `<section class="card"><div class="sec-head"><div class="badge" aria-hidden="true">${esc(m.e)}</div><div><h3>${esc(m.name)}</h3><span class="sec-kcal num"><b>${kc(mv[0])}</b> kcal · ${m.dishes.length} prato(s)</span></div><button class="sec-add" type="button" data-act="draftadd" data-m="${mi}" aria-label="Adicionar prato em ${esc(m.name)}">+</button></div>
        <ul class="list" style="margin-top:12px">${m.dishes.map((e, ei) => { const inf = entryInfo(e), v = entryVal(e); return `<li class="li ing"><span class="ie">${esc(inf.e)}</span><span class="txt"><span class="nm">${esc(inf.n)}</span><br><span class="ms num">${kc(v[0])} kcal · P ${gr(v[1])} · C ${gr(v[2])} · G ${gr(v[3])}</span></span><span class="row"><span class="stepper"><button type="button" data-act="draftq" data-m="${mi}" data-e="${ei}" data-d="-0.5" aria-label="Menos">−</button><span class="num">${f1.format(e.q)}×</span><button type="button" data-act="draftq" data-m="${mi}" data-e="${ei}" data-d="0.5" aria-label="Mais">+</button></span><button class="btn icon ghost" data-act="draftrmdish" data-m="${mi}" data-e="${ei}" aria-label="Tirar ${esc(inf.n)}">✕</button></span></li>`; }).join('') || '<li class="muted">Sem pratos. Toque em + para adicionar.</li>'}</ul>
        <div class="foot"><button class="btn small" data-act="draftmeal" data-m="${mi}">✏️ Nome e emoji</button><button class="btn icon" data-act="draftmove" data-m="${mi}" data-d="-1" aria-label="Subir"${mi ? '' : ' disabled'}>↑</button><button class="btn icon" data-act="draftmove" data-m="${mi}" data-d="1" aria-label="Descer"${mi < d.meals.length - 1 ? '' : ' disabled'}>↓</button><button class="btn small danger" data-act="draftrmmeal" data-m="${mi}">🗑️ Tirar refeição</button></div></section>`;
    });
    return h + `<button class="btn block" data-act="draftnewmeal">➕ Nova refeição</button><button class="btn primary block" data-act="draftsave">💾 Salvar dieta</button></div>`;
  }

  // ---------- BIBLIOTECA ----------
  function recipeRow(r, act, extra) {
    const v = recipeVal(r);
    return `<li><button type="button" class="li click" data-act="${act}" data-t="r" data-id="${r.id}"${extra || ''}><span class="ie">${esc(r.e)}</span><span class="txt"><span class="nm">${esc(r.n)}</span><br><span class="ms">${esc(r.items.map(i => { const f = food(i.id); return f ? f.n.replace('*', '') : ''; }).filter(Boolean).join(', ') || 'Sem ingredientes')}</span></span><span class="mac num"><b>${kc(v[0])} kcal</b>P ${gr(v[1])} · C ${gr(v[2])} · G ${gr(v[3])}</span></button></li>`;
  }
  function foodRow(f, act, extra) {
    return `<li><button type="button" class="li click" data-act="${act}" data-t="f" data-id="${f.id}"${extra || ''}><span class="ie">${esc(f.e)}</span><span class="txt"><span class="nm">${esc(f.n)}</span><br><span class="ms">${esc(f.por)}${f.f ? ' · ' + esc(f.f) : ''}</span></span><span class="mac num"><b>${kc(f.k)} kcal</b>P ${gr(f.p)} · C ${gr(f.c)} · G ${gr(f.g)}</span></button></li>`;
  }
  function libList(tab, q, act) {
    const s = (q || '').toLowerCase();
    if (tab === 'r') return cfg.recipes.filter(r => !s || r.n.toLowerCase().includes(s)).sort((a, b) => a.n.localeCompare(b.n, 'pt')).map(r => recipeRow(r, act)).join('') || '<li class="muted">Nenhuma receita encontrada.</li>';
    return cfg.foods.filter(f => !s || f.n.toLowerCase().includes(s)).sort((a, b) => a.n.localeCompare(b.n, 'pt')).map(f => foodRow(f, act)).join('') || '<li class="muted">Nenhum alimento encontrado.</li>';
  }
  const libTabs = (cur, act) => `<div class="seg sec-tabs" role="group" aria-label="Tipo"><button type="button" data-act="${act}" data-id="r" aria-pressed="${cur === 'r'}">🍲 Receitas</button><button type="button" data-act="${act}" data-id="f" aria-pressed="${cur === 'f'}">🥕 Alimentos</button></div>`;
  function viewBiblioteca() {
    const t = ui.libTab;
    return `<div class="row between"><h2 class="view-title">📚 Biblioteca</h2><button class="btn primary small" data-act="${t === 'r' ? 'newrecipe' : 'newfood'}">➕ ${t === 'r' ? 'Nova receita' : 'Novo alimento'}</button></div>

  }

  // ---------- render ----------
  function render() {
    stamp(ui.date);
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === ui.tab ? 'page' : 'false'));
    $('hdrDate').textContent = fmtDay(todayKey());
    $('view').innerHTML = { hoje: viewHoje, progresso: viewProgresso, plano: viewPlano, dietas: viewDietas, biblioteca: viewBiblioteca }[ui.tab]();
  }

  // =====================================================================
  // Stateful sheet (stack of screens: pick, confirm, recipe, food, forms)
  // =====================================================================
  let stack = [], toastT, lastFocus = null;
  const top = () => stack[stack.length - 1];
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
  function openSheet(st) { if (!stack.length) lastFocus = document.activeElement; stack = [st]; showSheet(); }
  function pushSheet(st) { syncForm(); stack.push(st); renderSheet(true); }
  function popSheet() { stack.pop(); if (!stack.length) return closeSheet(); renderSheet(true); }
  function showSheet() { const s = $('sheet'); s.hidden = false; renderSheet(true); requestAnimationFrame(() => { s.classList.add('open'); $('scrim').classList.add('open'); }); }
  function closeSheet() { stack = []; const s = $('sheet'); s.classList.remove('open'); $('scrim').classList.remove('open'); setTimeout(() => { if (!s.classList.contains('open')) { s.hidden = true; s.innerHTML = ''; } }, 450); if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true }); }
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeSheet(); });

  const emojiField = (val) => `<div class="field"><label for="f-e">Emoji (toque e escolha no teclado ou abaixo)</label><div class="emoji-row"><input class="emoji-in" id="f-e" value="${esc(val)}" autocomplete="off"><div class="emoji-grid" id="f-eg">${FOOD_EMOJI.map(x => `<button type="button" data-emoji="${x}" aria-label="${x}">${x}</button>`).join('')}</div></div></div>`;
  const macroFields = (v) => `<div class="grid4"><div class="field"><label for="f-k">Calorias (kcal)</label><input id="f-k" inputmode="decimal" value="${v ? esc(v.k) : ''}" placeholder="0"></div><div class="field"><label for="f-p">Proteína (g)</label><input id="f-p" inputmode="decimal" value="${v ? esc(v.p) : ''}" placeholder="0"></div><div class="field"><label for="f-c">Carboidrato (g)</label><input id="f-c" inputmode="decimal" value="${v ? esc(v.c) : ''}" placeholder="0"></div><div class="field"><label for="f-g">Gordura (g)</label><input id="f-g" inputmode="decimal" value="${v ? esc(v.g) : ''}" placeholder="0"></div></div>`;

          <div><p class="label" style="margin-bottom:8px">Ingredientes</p><ul class="list">${r.items.map((it, ii) => { const f = food(it.id); if (!f) return ''; const fv = scale(foodVal(f), it.q); return `<li class="li ing"><span class="ie">${esc(f.e)}</span><span class="txt"><span class="nm">${esc(f.n)}</span><br><span class="ms num">${esc(f.por)} · ${kc(fv[0])} kcal</span></span><span class="row"><span class="stepper"><button type="button" data-act="iq" data-i="${ii}" data-d="-0.5" aria-label="Menos">−</button><span class="num">${f1.format(it.q)}×</span><button type="button" data-act="iq" data-i="${ii}" data-d="0.5" aria-label="Mais">+</button></span><button type="button" class="btn icon ghost" data-act="irm" data-i="${ii}" aria-label="Tirar ${esc(f.n)}">✕</button></span></li>`; }).join('') || '<li class="muted">Nenhum ingrediente ainda.</li>'}</ul>
          <button type="button" class="btn" style="margin-top:10px" data-act="iadd">➕ Adicionar ingrediente</button></div>
          <div><p class="label">Total da receita</p>${sumBox(v)}</div></div>
          ${actions(st.r.id && st.from === 'lib' ? '<button type="button" class="btn danger" data-act="delrecipe">🗑️ Excluir</button>' : '', backBtn(), '<button type="button" class="btn primary" data-act="saverecipe">💾 Salvar receita</button>')}`;
        break;
      }
      case 'food': {
        const f = st.f;
        h += `<h3 id="sheetTitle">${f.id ? '✏️ Alimento' : '🥕 Novo alimento'}</h3><div class="stack">${emojiField(f.e)}
          <div class="field"><label for="f-n">Nome</label><input id="f-n" value="${esc(f.n || '')}" placeholder="Ex.: Pão francês" autocomplete="off"></div>
          <div class="field"><label for="f-por">Porção</label><input id="f-por" value="${esc(f.por || '')}" placeholder="Ex.: 50 g · 1 unidade" autocomplete="off"></div>${macroFields(f.id || f.k ? f : null)}
          <div class="field"><label for="f-f">Fonte (opcional)</label><input id="f-f" value="${esc(f.f || '')}" placeholder="Ex.: TACO, rótulo" autocomplete="off"></div></div>
          ${actions(f.id && st.from === 'lib' ? '<button type="button" class="btn danger" data-act="delfood">🗑️ Excluir</button>' : '', backBtn(), '<button type="button" class="btn primary" data-act="savefood">💾 Salvar</button>')}`;
        break;
      }
      case 'dish': {
        const m = findMeal(dayMeals(ui.date), st.meal), e = m && m.dishes.find(x => x.u === st.u); if (!e) { closeSheet(); return; }
        const inf = entryInfo(e), v = entryVal(e);
        const ings = e.t === 'r' && recipe(e.id) ? recipe(e.id).items.map(it => { const f = food(it.id); if (!f) return ''; const fv = scale(foodVal(f), it.q * e.q); return `<li class="li"><span class="ie">${esc(f.e)}</span><span class="txt"><span class="nm">${esc(qf(it.q * e.q) + f.n)}</span><br><span class="ms">${esc(f.por)}</span></span><span class="mac num"><b>${kc(fv[0])} kcal</b>P ${gr(fv[1])} · C ${gr(fv[2])} · G ${gr(fv[3])}</span></li>`; }).join('') : '';
        h += `<h3 id="sheetTitle">${esc(inf.e)} ${esc(qf(e.q) + inf.n)}</h3><p class="muted">${esc(m.e + ' ' + m.name)}${e.today ? ' · só neste dia' : ''}</p>${sumBox(v)}${ings ? `<p class="label" style="margin:16px 0 8px">Ingredientes</p><ul class="list">${ings}</ul>` : ''}
          <p style="margin-top:18px;font-weight:800">Tirar este prato:</p>
          <div class="choice"><button type="button" class="btn" data-act="rmscope" data-scope="day">📅 Só neste dia</button>${e.today ? '' : `<button type="button" class="btn danger" data-act="rmscope" data-scope="all">🔁 Todos os dias<small>${esc(saveHint())}</small></button>`}</div>
          ${actions(e.t === 'r' && recipe(e.id) ? '<button type="button" class="btn" data-act="dishedit">✏️ Editar receita</button>' : '', '<button type="button" class="btn" data-act="sclose">Fechar</button>')}`;

      case 'name': {

          ${st.scope ? `<div class="choice"><button type="button" class="btn primary" data-act="${st.save}" data-scope="day">📅 Só neste dia</button><button type="button" class="btn" data-act="${st.save}" data-scope="all">🔁 Todos os dias<small>${esc(saveHint())}</small></button></div>${actions(backBtn())}` : actions(backBtn(), `<button type="button" class="btn primary" data-act="${st.save}">💾 Salvar</button>`)}`;

          ${b ? `<button type="button" class="btn" data-act="dsave" data-how="replace">✏️ Atualizar “${esc(b.name)}”<small>Muda a dieta original.</small></button>` : ''}</div>${actions(backBtn())}`;
        break;
      }
      case 'confirmdel': h += `<h3 id="sheetTitle">${esc(st.title)}</h3><p class="muted" style="font-size:15px">${esc(st.text)}</p>${actions(backBtn(), `<button type="button" class="btn danger" data-act="${st.yes}">Confirmar</button>`)}`; break;

  function saveHint() { const d = dietFor(ui.date); return d.created === todayKey() ? 'Muda a dieta “' + d.name + '” (criada hoje).' : 'Cria “' + nextName(d.name) + '” com a mudança; “' + d.name + '” fica guardada.'; }

  // =====================================================================
  // Events
  // =====================================================================
  function focusAfter(sel, pop) { const el = document.querySelector(sel); if (el) { el.focus({ preventScroll: true }); if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } } }
  document.querySelector('.tabbar').addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; ui.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); });

  const mealNameOf = (id) => { const m = findMeal(dayMeals(ui.date), id); return m ? m.e + ' ' + m.name : ''; };
  function afterDietChange(res, what) {
    if (res.created) toast('✨ ' + what + ' · criada “' + res.d.name + '”');
    else toast('🔁 ' + what + ' em “' + res.d.name + '”');
  }

  document.getElementById('sheet').addEventListener('click', e => {
    const em = e.target.closest('[data-emoji]');
