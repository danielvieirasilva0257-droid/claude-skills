<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Conteúdo</title>
<style>
:root{
  --bg:#0b0d12; --panel:#141821; --line:#252b38; --text:#eef1f6; --muted:#9aa3b5;
  --accent:#c6f432; --accent2:#5ee1ff; --warn:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.deck{position:relative;height:100%;width:100%}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 16px 88px;opacity:0;transform:translateX(40px);transition:opacity .45s cubic-bezier(.2,.7,.2,1),transform .45s cubic-bezier(.2,.7,.2,1);pointer-events:none;overflow-y:auto}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-40px)}
.card{width:min(1040px,100%);display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start}
.num{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,58px);line-height:1.02;letter-spacing:-.03em;font-weight:800}
h2{font-size:clamp(26px,3.6vw,44px);line-height:1.05;letter-spacing:-.025em;font-weight:800}
.lead{margin-top:18px;color:var(--muted);font-size:clamp(15px,1.6vw,18px);line-height:1.55}
.tag{display:inline-block;margin-top:18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--accent2)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 14px}
.box h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none;font-size:15px;line-height:1.45}
.check:first-of-type{border-top:0}
.check input{appearance:none;flex:0 0 20px;height:20px;margin-top:1px;border:2px solid #3a4152;border-radius:6px;display:grid;place-items:center;transition:.2s}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid #0b0d12;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.example{margin-top:18px;padding:14px 16px;border-left:3px solid var(--accent2);background:rgba(94,225,255,.06);border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.5;color:#cfd6e4}
.example b{color:var(--accent2)}
.cover{display:block;text-align:left;max-width:900px}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.coin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.coin b{display:block;font-size:28px;color:var(--accent);font-weight:800}
.coin span{color:var(--muted);font-size:14px}
.skel{counter-reset:s;margin-top:26px;display:grid;gap:12px}
.skel li{list-style:none;counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.45}
.skel li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:9px;background:var(--accent);color:#0b0d12;font-weight:800;display:grid;place-items:center}
.bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(20,24,33,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 8px}
.nav button{background:none;border:0;color:var(--text);width:38px;height:38px;border-radius:999px;font-size:18px;cursor:pointer}
.nav button:hover{background:#222838}
.nav .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:56px;text-align:center}
.hint{position:fixed;top:14px;right:16px;font-size:12px;color:#5d6577}
@media (max-width:760px){
  .card{grid-template-columns:1fr;gap:22px}
  .coins{grid-template-columns:1fr}
  .slide{align-items:flex-start;padding-top:40px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="hint">← → para navegar · clique nos itens para marcar</div>
<main class="deck" id="deck"></main>
<nav class="nav">
  <button id="prev" aria-label="Slide anterior">←</button>
  <span class="count" id="count"></span>
  <button id="next" aria-label="Próximo slide">→</button>
</nav>
<script>
const steps = [
  {n:"1 · Ideia", t:"Escolha um tema que já tem interesse", lead:"O YouTube virou rede de interesse: ele entrega o vídeo para quem tende a assistir até o fim, não para os seus inscritos.",
   ex:"<b>No vídeo:</b> canais com menos de 30 mil inscritos (Resenha Rentável) fazem centenas de milhares de views por vídeo.",
   c:["O tema tem público que já consome vídeos parecidos","Achei 3 canais pequenos com muitas views nesse tema","Sei qual pergunta o público quer ver respondida","Consigo resumir a promessa numa frase"]},
  {n:"2 · Contradição", t:"Ache o “como assim?” do tema", lead:"Contradição é a afirmação que faz o espectador duvidar da visão de mundo dele, e curiosidade nasce disso.",
   ex:"<b>No vídeo:</b> quem está no top 1% de renda no Brasil fica entre os mais pobres dos EUA. E a Noruega é rica com Estado grande.",
   c:["Listei 3 crenças comuns do meu público sobre o tema","Achei um dado ou fato que quebra uma delas","A contradição é verdadeira e eu consigo provar","Ela cabe em uma frase dita em menos de 10 s"]},
  {n:"3 · Título e thumb", t:"A embalagem cria a expectativa", lead:"Taxa de cliques é a moeda 1, mas CTR alto sem retenção é clickbait e o YouTube corta o alcance.",
   ex:"<b>No vídeo:</b> o teste A/B do YouTube Studio escolhe a thumb pelo tempo assistido total, e não pelo CTR.",
   c:["Fiz 3 variações de título e de thumb","Cada variação promete algo que o vídeo cumpre","A thumb mostra a contradição ou o resultado","Vou subir com o teste A/B ligado"]},
  {n:"4 · Pesquisa e prompt", t:"Junte provas e defina o diferencial", lead:"O espectador escolhe a melhor versão do tema entre vários vídeos. Escolha seu diferencial: esforço, autoridade, acesso ou personalidade.",
   ex:"<b>No vídeo:</b> para cenas sem recurso, IA no Higgsfield: character sheet → cenário → objeto → prompt de vídeo escrito com o Claude.",
   c:["Tenho números, documentos ou imagens que provam a promessa","Escolhi o diferencial principal deste vídeo","Separei o melhor momento para virar teaser","Planejei as cenas que precisam de IA (se faltar recurso)"]},
  {n:"5 · Roteiro, parte 1", t:"Introdução: gancho + prova + diferencial", lead:"A intro decide o tempo assistido (moeda 2). É nela que o público acredita que você vai cumprir o que prometeu.",
   ex:"<b>No vídeo:</b> abre com ele pedindo like numa placa enquanto diz que pedir like não serve. Contradição visual em 3 s.",
   c:["Gancho em até 10 s, com contradição falada e visual","Quebra de padrão até 30 s (humor, objeção, personagem)","Prova: repito a pergunta do título ou mostro um teaser de 1 a 2 s","Credencial ou diferencial dito com número","Promessa clara do que vou abrir"]},
  {n:"6 · Roteiro, parte 2", t:"Desenvolvimento: linha esticada, nunca frouxa", lead:"Cada bloco paga uma promessa e abre outra. Use alternância de padrões e tensão e respiro.",
   ex:"<b>No vídeo:</b> jogo do padrão, quiz de pegadinha, lista “4 tipos, anota aí”, a virada “isso não serve de nada se…” e a pescaria revelada como técnica.",
   c:["Todo bloco abre um loop e eu anotei onde ele fecha","Tem um jogo ou quiz em que o público participa","Tem uma virada no meio do vídeo","Tem uma demonstração física ou metáfora visual","Marquei 3 ou 4 check-ins (“tá comigo?”)"]},
  {n:"7 · Roteiro, parte 3", t:"CTA do negócio + próximo vídeo", lead:"Conteúdo existe para gerar negócio. Produto vira commodity; a conexão humana não se copia.",
   ex:"<b>No vídeo:</b> a imersão vem como continuação lógica, e no fim ele revela que aquele era o 3º passo do sistema. Termina indicando outro vídeo.",
   c:["O CTA continua o que eu ensinei","Mostro a dor, a credencial, a oferta e o critério","Revelo a estrutura (“caso não tenha percebido…”)","Indico um próximo vídeo meu (tempo de sessão)","Não peço like nem inscrição"]},
  {n:"8 · Gravação", t:"Mostre esforço e personalidade", lead:"Personalidade é transparência com as emoções e as escolhas criativas que você faz. O roteiro é só referência.",
   ex:"<b>No vídeo:</b> plano impresso na mão, segunda câmera, troca de cenário, alter egos (fã do MrBeast, apresentador de quiz).",
   c:["Tenho pelo menos 2 ângulos ou 2 cenários","Há um objeto ou ação real que mostra esforço","Gravei as objeções do público como personagem ou pergunta","Improvisei em cima do roteiro, sem decorar"]},
  {n:"9 · Edição", t:"Troque o estímulo sem cansar", lead:"Vídeo cru faz a curva cair. Vídeo frenético cansa. O meio-termo é alternância com pausas.",
   ex:"<b>No vídeo:</b> gravação de tela com janelinha, texto grande só na palavra-chave (REDE, TAXA, QUEBRA, TEASER), b-roll de cada exemplo e as pausas mantidas.",
   c:["Troca de estímulo em cada bloco (tela, b-roll, animação, entrevista)","Texto na tela só em palavras-chave, sem texto sobre texto","Mantive as pausas antes das revelações","Sem corte a cada meio segundo nem som em toda frase","Revisei: a curva ficaria reta?"]},
  {n:"10 · Finalização e publicação", t:"Prove na intro, leve para o próximo", lead:"Com uma intro bem feita, a retenção fica em 70–80% aos 30 s. Depois leia as 3 moedas e ajuste.",
   ex:"<b>No vídeo:</b> o Breno se arrepende de não ter posto um teaser do comprovante de R$10 mil na intro de outro vídeo.",
   c:["Teaser de 1 a 2 s do melhor momento na intro","Tela final e card para outro vídeo meu","Publiquei com o teste A/B de título e thumb","Depois de 48 h: olhei CTR, retenção aos 30 s e sessão","Anotei onde a curva caiu e o que havia na tela"]}
];

const deck = document.getElementById('deck');
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const saved = store.get('lk1-checks') || {};
let html = `
<section class="slide"><div class="cover">
  <div class="num">Guia de produção · baseado no vídeo LK1GKHCdNAA</div>
  <h1>Você não faz ideia de como o YouTube funciona.</h1>
  <p class="lead">O sistema em 3 partes (introdução, desenvolvimento, CTA) e as 3 moedas que o algoritmo realmente paga. Um slide por etapa, com checklist.</p>
  <div class="coins">
    <div class="coin"><b>CTR</b><span>Moeda 1 · taxa de cliques na embalagem</span></div>
    <div class="coin"><b>Tempo</b><span>Moeda 2 · tempo assistido do vídeo</span></div>
    <div class="coin"><b>Sessão</b><span>Moeda 3 · tempo de sessão no seu canal</span></div>
  </div>
  <span class="tag">Inscritos, likes e comentários são consequência</span>
</div></section>`;
steps.forEach((s,i)=>{
  html += `<section class="slide"><div class="card">
    <div><div class="num">${s.n}</div><h2>${s.t}</h2><p class="lead">${s.lead}</p><div class="example">${s.ex}</div></div>
    <div class="box"><h3>Checklist</h3>${s.c.map((c,j)=>{const id=`s${i}c${j}`;return `<label class="check"><input type="checkbox" data-id="${id}" ${saved[id]?'checked':''}><span>${c}</span></label>`}).join('')}</div>
  </div></section>`;
});
html += `
<section class="slide"><div class="cover">
  <div class="num">Para começar hoje</div>
  <h2>O esqueleto em 5 linhas</h2>
  <ol class="skel">
    <li>Embalagem honesta: título e thumb prometem o que o vídeo entrega.</li>
    <li>Intro em 30 s: gancho (contradição) + prova (teaser) + diferencial.</li>
    <li>Desenvolvimento: promessas pagas aos poucos, loops e troca de estímulo, com tensão e respiro.</li>
    <li>Ensine fazendo e revele depois: “percebeu que eu acabei de fazer isso com você?”</li>
    <li>Feche com o CTA do seu negócio e um próximo vídeo, sem pedir like.</li>
  </ol>
</div></section>`;
deck.innerHTML = html;

deck.addEventListener('change', e=>{
  const id = e.target.dataset && e.target.dataset.id; if(!id) return;
  saved[id] = e.target.checked; store.set('lk1-checks', saved);
});

const slides = [...deck.querySelectorAll('.slide')];
let cur = Math.min(Math.max(parseInt((location.hash||'').slice(1))||0,0),slides.length-1);
function show(i){
  cur = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k)=>{ s.classList.toggle('on',k===cur); s.classList.toggle('prev',k<cur); });
  document.getElementById('count').textContent = `${cur+1} / ${slides.length}`;
  document.getElementById('bar').style.width = `${(cur+1)/slides.length*100}%`;
  history.replaceState(null,'','#'+cur);
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}
  if(e.key==='Home')show(0); if(e.key==='End')show(slides.length-1);
});
let x0=null;
addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>60) show(cur+(dx<0?1:-1)); x0=null; });
show(cur);
</script>
</body>
</html>
