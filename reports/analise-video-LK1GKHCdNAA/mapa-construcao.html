<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquitetura do Vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design (ui-ux-pro-max): mode Operar/Ler · archetype "instrumento de precisão" claro
   1 font (Instrument Sans 400/500/600) · 1 accent (action only) · radius 8/12/pill · no card shadows
   category colors = small dots only (meaning: which category you are in) */
:root{
  --canvas:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --border:#dfe2e8; --border-strong:#c9ced7;
  --text:#1d1f24; --text-2:#4f5561; --text-3:#7a808b;
  --action:#2451c7; --action-hover:#1e45ab; --action-soft:#e8eefb; --on-action:#ffffff;
  --warn:#b4361f;
  --cat1:#3a6fd8; --cat2:#cf4a3a; --cat3:#2d86a6; --cat4:#c98410; --cat5:#2f9467; --cat6:#7d5bc9; --cat7:#13899f; --cat8:#b84790; --cat9:#5d6b80;
  --r-s:8px; --r-m:12px; --r-p:9999px;
  --ease:cubic-bezier(.2,0,0,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0c0d10; --surface:#15171b; --surface-2:#1d2026; --border:#262a31; --border-strong:#353a43;
    --text:#f2f3f5; --text-2:#b9bec8; --text-3:#8a909b;
    --action:#7aa2ff; --action-hover:#93b4ff; --action-soft:#1b2540; --on-action:#0c0d10; --warn:#ff8a73;
    --cat1:#7aa2ff; --cat2:#ff8a73; --cat3:#5fbad9; --cat4:#f0b04a; --cat5:#5ccb96; --cat6:#ad93ff; --cat7:#4fc6d9; --cat8:#ec86c6; --cat9:#9aa7ba;
  }
}
:root[data-theme="dark"]{
  --canvas:#0c0d10; --surface:#15171b; --surface-2:#1d2026; --border:#262a31; --border-strong:#353a43;
  --text:#f2f3f5; --text-2:#b9bec8; --text-3:#8a909b;
  --action:#7aa2ff; --action-hover:#93b4ff; --action-soft:#1b2540; --on-action:#0c0d10; --warn:#ff8a73;
  --cat1:#7aa2ff; --cat2:#ff8a73; --cat3:#5fbad9; --cat4:#f0b04a; --cat5:#5ccb96; --cat6:#ad93ff; --cat7:#4fc6d9; --cat8:#ec86c6; --cat9:#9aa7ba;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--canvas);color:var(--text);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh}
::selection{background:var(--action-soft)}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--border)}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.top .sp{flex:1}
.tbtn{height:40px;padding:0 14px;border-radius:var(--r-p);border:1px solid var(--border-strong);font-size:14px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:8px;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.tbtn:hover{background:var(--surface-2)}
.tbtn .count{min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-p);background:var(--action);color:var(--on-action);font-size:12px;display:inline-grid;place-items:center}
.only-m{display:none}

/* layout */
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100dvh - 56px)}
.map{position:sticky;top:56px;height:calc(100dvh - 56px);overflow:auto;border-right:1px solid var(--border);background:var(--surface);padding:16px 12px 32px}
.map h2{font-size:13px;font-weight:600;color:var(--text-3);padding:4px 8px 10px}
.search{width:100%;height:40px;border:1px solid var(--border);background:var(--canvas);border-radius:var(--r-s);padding:0 12px;margin-bottom:12px;font-size:15px}
.search::placeholder{color:var(--text-3)}

/* mind map tree */
.tree,.tree ul{list-style:none}
.tree ul{margin-left:15px;padding-left:12px;border-left:1px solid var(--border)}
.tree li{position:relative}
.tree ul > li::before{content:"";position:absolute;left:-12px;top:21px;width:10px;border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:4px;min-height:40px;border-radius:var(--r-s)}
.row:hover{background:var(--surface-2)}
.row.cur{background:var(--action-soft)}
.row.cur .lnk{color:var(--action);font-weight:600}
.car{width:28px;height:36px;flex:0 0 28px;display:grid;place-items:center;color:var(--text-3);border-radius:6px}
.car svg{transition:transform .2s var(--ease)}
.car[aria-expanded="true"] svg{transform:rotate(90deg)}
.car.leaf{visibility:hidden}
.lnk{flex:1;text-align:left;padding:8px 8px 8px 0;font-size:14.5px;line-height:1.3;color:var(--text-2);display:flex;align-items:center;gap:9px}
.lvl1 > .row .lnk{font-weight:600;color:var(--text);font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.has-note::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--action);margin-left:auto;margin-right:6px}
.tree li[hidden]{display:none}

/* content */
main{min-width:0;padding:32px 24px 120px}
.page{max-width:720px;margin:0 auto}
.crumb{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:13.5px;color:var(--text-3);margin-bottom:12px}
.crumb button{color:var(--text-3);padding:2px 0;border-radius:4px}
.crumb button:hover{color:var(--text)}
.crumb span{color:var(--border-strong)}
.cat{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);margin-bottom:8px}
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:18px;color:var(--text-2);margin-top:12px;max-width:62ch;text-wrap:pretty}
.block{padding:24px 0;border-top:1px solid var(--border)}
.block:first-of-type{border-top:0}
.block h2{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px}
.block p,.block li{color:var(--text-2);max-width:66ch}
.block ol,.block ul{padding-left:22px;display:grid;gap:8px}
.block li::marker{color:var(--text-3)}
.note-line{margin-top:14px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);font-size:15px;color:var(--text-2)}
.quote{padding:14px 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--border);color:var(--text)}
.err li{color:var(--text-2)}
.err li::marker{color:var(--warn)}

/* access options */
.opts{margin-top:28px}
.opts h2{font-size:15px;font-weight:600;margin-bottom:4px}
.opts .hint{font-size:14px;color:var(--text-3);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-m);background:var(--surface);text-align:left;font-weight:500;font-size:15px;line-height:1.3;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.opt:hover{border-color:var(--action);background:var(--action-soft)}
.opt small{display:block;font-weight:400;font-size:12.5px;color:var(--text-3);margin-top:2px}
.opt .n{margin-left:auto;font-size:12.5px;color:var(--text-3);font-weight:400;white-space:nowrap}

/* notes */
.notes textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;font-size:15.5px;line-height:1.55}
.notes textarea::placeholder{color:var(--text-3)}
.notes .st{font-size:13px;color:var(--text-3);margin-top:6px;min-height:20px}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:32px}
.pg{min-height:64px;padding:10px 16px;border-radius:var(--r-m);border:1px solid var(--border);background:var(--surface);text-align:left;line-height:1.3}
.pg.nx{text-align:right;background:var(--action);border-color:var(--action);color:var(--on-action)}
.pg.nx:hover{background:var(--action-hover)}
.pg small{display:block;font-size:12.5px;opacity:.75}
.pg b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg:disabled{opacity:.35;cursor:default}

/* notes page */
.nlist{display:grid;gap:12px;margin-top:20px}
.nitem{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-m);padding:14px 16px}
.nitem button{font-weight:600;color:var(--action);text-align:left}
.nitem p{white-space:pre-wrap;color:var(--text-2);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn-p{height:44px;padding:0 18px;border-radius:var(--r-p);background:var(--action);color:var(--on-action);font-weight:500}
.btn-s{height:44px;padding:0 18px;border-radius:var(--r-p);border:1px solid var(--border-strong);font-weight:500}

.fade{animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scrim{display:none}

@media (max-width:860px){
  .only-m{display:inline-flex}
  .top{gap:8px}
  .brand{font-size:15px;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tbtn{padding:0 12px}
  .hide-m{display:none}
  .wrap{grid-template-columns:1fr}
  .map{position:fixed;z-index:40;top:0;left:0;bottom:0;height:100dvh;width:min(88vw,360px);transform:translateX(-102%);transition:transform .3s var(--ease-drawer);box-shadow:0 0 0 1px var(--border),0 20px 60px rgba(12,13,16,.18);padding-top:max(16px,env(safe-area-inset-top))}
  .map.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(12,13,16,.35);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
  .scrim.on{opacity:1;pointer-events:auto}
  main{padding:20px 16px calc(110px + env(safe-area-inset-bottom))}
  .pager{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--border)}
  .pg{min-height:52px}
  .grid{grid-template-columns:1fr}
}
@media (max-width:420px){ .brand{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="tbtn only-m" id="openMap" aria-label="Abrir o mapa" aria-controls="map">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Mapa
  </button>
  <span class="brand">Arquitetura do vídeo</span>
  <span class="sp"></span>
  <button class="tbtn" id="goNotes">Anotações <span class="count" id="ncount">0</span></button>
</header>
<div class="wrap">
  <nav class="map" id="map" aria-label="Mapa mental por categorias">
    <h2>Mapa mental</h2>
    <input class="search" id="search" type="search" placeholder="Buscar uma parte" aria-label="Buscar uma parte do mapa" autocomplete="off">
    <ul class="tree" id="tree"></ul>
  </nav>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<div class="scrim" id="scrim"></div>

<script>
const DATA = {n:"Vídeo", o:"O mapa completo para construir um vídeo do zero: ideia → embalagem → preparação → roteiro (começo, meio e fim) → gravação → edição → publicação. Siga os ramos na ordem; cada um mostra o que fazer e por que funciona.",
p:"Todo o mapa serve a três coisas que o YouTube mede e recompensa: (1) a pessoa clicar na embalagem, (2) assistir muito tempo e (3) continuar no seu canal depois. Like, comentário e inscrito são consequência disso. Por isso cada decisão do mapa responde a uma pergunta: isso faz clicar, faz ficar ou faz continuar?",
c:["Comece pelo ramo 1 e use o botão “Próximo passo” para percorrer tudo na ordem de construção.","Volte a este mapa em cada vídeo: ele é um checklist de arquitetura, não uma teoria."],
k:[
{n:"1. Ideia", o:"Definir o tema, para quem é, qual a contradição que vai prender e qual promessa o vídeo cumpre. Tudo nasce daqui.",
 p:"O YouTube virou uma rede de interesse: ele mostra o vídeo para quem já demonstrou interesse por temas parecidos, não para os seus inscritos. Uma ideia com interesse claro tem um público pronto para receber o vídeo.",
 c:["Escolha o tema pelo público, não por você.","Ache a contradição do tema.","Feche a promessa numa frase.","Valide olhando canais pequenos com muitas views no mesmo tema."],
 k:[
  {n:"Tema com interesse", o:"Um assunto que um grupo específico de pessoas já procura e assiste.",
   p:"O vídeo é testado primeiro num grupo pequeno parecido com o seu público. Se esse grupo já se interessa pelo tema, ele clica e assiste, e o vídeo passa para grupos maiores.",
   c:["Liste 10 temas que seu público já assiste em outros canais.","Prefira um ângulo novo de um tema comprovado a um tema que ninguém procura.","Pergunte: quem assistiria isso até o fim?"],
   e:"Um canal sobre Harry Potter falando da nova série da HBO é mostrado para quem assistiu conteúdos parecidos recentemente.",
   x:["Escolher o tema porque você gosta, sem público.","Tema amplo demais (“finanças”) em vez de um recorte (“quanto precisa ganhar para não ser pobre em lugar nenhum”)."]},
  {n:"Público-alvo", o:"A pessoa específica que vai assistir: o que ela já sabe, no que acredita e o que quer.",
   p:"Você só consegue quebrar uma crença ou cutucar uma dor se souber qual é a crença e qual é a dor. O gancho depende disso.",
   c:["Escreva em uma linha: “Este vídeo é para quem…”.","Liste 3 crenças comuns desse público sobre o tema.","Liste a dúvida principal que ele tem."],
   x:["Falar com “todo mundo”: o gancho fica genérico."]},
  {n:"Contradição central", o:"O fato ou a afirmação que vai contra o que o público acredita. É o motor de curiosidade do vídeo inteiro.",
   p:"Quando alguém ouve algo que contradiz a visão de mundo dele, o cérebro quer resolver o conflito: “como assim?”. Essa curiosidade dá tempo para você provar que vai entregar.",
   c:["Pegue cada crença do público e procure um dado ou caso real que a quebre.","Teste: a frase faz alguém dizer “como assim?” logo na primeira frase?","Confirme que é verdade e que você consegue provar."],
   e:"O top 1% de renda no Brasil fica na metade mais pobre dos EUA. A Noruega é rica com Estado grande, contra o que os liberais pregam.",
   f:"[Coisa que todos acham verdade]… só que [fato que contradiz]. Como assim?",
   x:["Contradição falsa ou exagerada: vira clickbait e derruba a retenção."]},
  {n:"Promessa em uma frase", o:"O que a pessoa vai saber, ver ou conseguir ao final do vídeo.",
   p:"A promessa vira o título, a thumb e o fio condutor do roteiro. Tudo que não serve à promessa sai do vídeo.",
   c:["Complete: “Depois deste vídeo você vai…”.","Use a promessa para cortar blocos que fogem dela."],
   f:"Vou te mostrar [resultado] usando [método/prova], mesmo que [objeção]."},
  {n:"Validação", o:"Conferir se ideias parecidas já funcionam para canais pequenos.",
   p:"Se um canal com poucos inscritos fez muitas views com o tema, é porque o interesse existe e o YouTube entrega esse tema para quem não é inscrito.",
   c:["Procure o tema no YouTube e filtre canais pequenos.","Anote os vídeos com views muito acima dos inscritos.","Veja títulos, thumbs e os primeiros 30 s deles."],
   e:"Resenha Rentável, com menos de 30 mil inscritos e centenas de milhares de views por vídeo; Mack Hopkins, com 7 vídeos e todos acima de 5 milhões."}
 ]},
{n:"2. Embalagem", o:"Título e thumb: o que a pessoa vê antes de clicar. É o primeiro contrato com o espectador.",
 p:"A embalagem decide o clique e cria a expectativa. Se a expectativa for cumprida, a pessoa assiste e o vídeo cresce. Se não for, ela sai e o YouTube corta o alcance.",
 c:["Faça a embalagem ANTES do roteiro.","Crie 3 variações para teste.","Confira que o vídeo entrega exatamente o que a embalagem promete."],
 k:[
  {n:"Título", o:"A frase que resume a promessa ou a contradição.",
   p:"O título é lido em menos de 1 segundo entre vários vídeos. Ele precisa despertar curiosidade E dizer do que o vídeo trata.",
   c:["Use a contradição ou a pergunta que o vídeo responde.","Palavras concretas, sem enrolação.","Escreva 3 versões diferentes."],
   e:"“Quanto você precisa ganhar para não ser pobre em nenhum lugar do mundo?” e “A Noruega é o experimento socialista que deu certo?”",
   x:["Título que promete algo que o vídeo não entrega."]},
  {n:"Thumb", o:"A imagem que complementa o título: mostra a emoção, o resultado ou o conflito.",
   p:"A imagem é processada antes do texto. Ela precisa criar a mesma expectativa do título, sem repetir o título.",
   c:["Um elemento principal grande e legível no celular.","Mostre o conflito ou o resultado.","Compare a sua thumb ao lado das concorrentes."]},
  {n:"Expectativa (contrato)", o:"A soma do título com a thumb gera uma expectativa do tipo de vídeo que a pessoa vai ver.",
   p:"Os primeiros segundos são os mais críticos porque é neles que o público decide se você vai cumprir o que a embalagem prometeu.",
   c:["Escreva: “Quem clicar espera ver…”.","A intro precisa confirmar exatamente isso."],
   x:["Clickbait: muitos cliques e saída rápida. O YouTube entende como enganação e mata o alcance."]},
  {n:"Teste A/B", o:"Publicar com 2 ou 3 versões de título e thumb no YouTube Studio para ele escolher a melhor.",
   p:"O teste escolhe pelo tempo assistido total de cada grupo, e não pela taxa de cliques. Uma thumb com menos cliques pode vencer se quem clicou assistiu mais.",
   c:["Suba as variações no lançamento.","Não escolha pela variação “mais clicável”, e sim pela que traz quem assiste."]}
 ]},
{n:"3. Preparação", o:"Juntar o material antes de escrever: provas, diferencial, melhor momento, mapa de loops e recursos de cena.",
 p:"Um roteiro forte nasce de material forte. Sem prova não existe intro que segure; sem diferencial a pessoa escolhe outro vídeo sobre o mesmo tema.",
 c:["Separe as provas.","Escolha 1 diferencial principal.","Defina o melhor momento (teaser).","Desenhe os loops.","Liste as cenas e os recursos."],
 k:[
  {n:"Provas", o:"Tudo que demonstra que a promessa é real: números, documentos, viagens, entrevistas, resultados, prints.",
   p:"A prova dá ao espectador a confiança de que vale investir o tempo dele no vídeo. Ele “relaxa na cadeira” porque sabe que vai receber o que foi prometido.",
   c:["Liste cada afirmação do vídeo e a prova de cada uma.","Prefira prova visual a prova falada."]},
  {n:"Diferencial escolhido", o:"A razão para assistirem VOCÊ e não outro vídeo do mesmo tema: esforço, autoridade, acesso ou personalidade.",
   p:"Ao lado do seu vídeo existem vários outros sobre o mesmo tema. A pessoa escolhe a melhor versão do tema.",
   c:["Escolha qual dos 4 diferenciais é o mais forte NESTE vídeo.","Planeje como ele aparece nos primeiros 60 s."]},
  {n:"Melhor momento (teaser)", o:"O trecho mais forte do vídeo (o resultado, a revelação, a reação) que vai aparecer de relance na intro.",
   p:"Mostrar 1 a 2 s do melhor momento prova que a promessa vai ser cumprida. É a prova mais forte que existe.",
   c:["Defina o momento antes de gravar, para garantir que ele seja filmado.","Marque no roteiro onde ele entra na intro."],
   e:"No vídeo “Ganhei R$10 mil em 48h com IA” faltou mostrar o comprovante de pagamento do final logo na intro."},
  {n:"Mapa de loops", o:"A lista de perguntas que o vídeo abre e o momento em que cada uma é respondida.",
   p:"Um loop aberto (uma pergunta sem resposta) faz o cérebro querer ficar até o fechamento. Loops encadeados prendem minuto após minuto.",
   c:["Liste 5 a 8 perguntas que o vídeo vai responder.","Decida a ordem: abra uma antes de fechar a anterior.","Guarde a maior para o final."]},
  {n:"Recursos e cenas", o:"O que você precisa filmar ou gerar: cenários, objetos, telas, b-roll, personagens.",
   p:"A troca de estímulo visual é o que mantém a retenção no meio do vídeo. Ela precisa estar prevista antes da gravação.",
   c:["Para cada bloco, anote 1 troca visual.","Quando faltar recurso (lugar, equipe), use cenas geradas por IA, mantendo o vídeo humano."],
   e:"A pescaria custou um dia de gravação. A mesma cena foi refeita com IA: character sheet → cenário → objeto → prompt de vídeo."}
 ]},
{n:"4. Começo: Introdução", o:"A parte que decide se a pessoa fica. Tem quatro peças, nesta ordem: gancho → quebra de padrão → prova → diferencial, e termina com a promessa do que vem.",
 p:"A intro é a parte mais importante para o tempo assistido. É nela que a pessoa decide se fica e se acredita que você vai cumprir a promessa. Se ela falha, nada do resto é visto.",
 c:["Gancho: abre o vídeo, antes de qualquer apresentação.","Quebra de padrão e revelação do conceito central.","Prova: de preferência um teaser do melhor momento.","Diferencial e promessa do que vai ser aberto, fechando com o loop principal."],

 "Prova": "Tutorial: mostre o resultado pronto. Review: mostre o produto nas suas mãos e o teste acontecendo. Vlog ou desafio: mostre um relance do final. Análise: mostre o documento, o gráfico ou a fonte.",
 "Diferencial": "Em qualquer tema, pergunte: o que eu fiz de difícil (esforço), o que eu sei por experiência (autoridade), onde eu cheguei que outros não chegam (acesso) e como eu conto isso do meu jeito (personalidade).",
 "Personalidade": "Funciona em qualquer formato porque é o único diferencial que ninguém copia. Reações reais, opiniões claras e escolhas criativas de cena valem para tutorial, review e vlog.",
 "5. Meio: Desenvolvimento": "Tutorial: cada passo é um bloco. Review: cada critério testado é um bloco. História: cada virada é um bloco. Análise: cada argumento ou evidência é um bloco. A anatomia do bloco é sempre a mesma.",
 "Anatomia de um bloco": "Serve para qualquer conteúdo: pergunta ou promessa → entrega com exemplo → troca de imagem → respiro → próxima pergunta.",
 "Demonstração física e metáfora": "Tutorial: faça na frente da câmera em vez de explicar. Finanças: use objetos para mostrar proporções. Tecnologia: uma comparação com algo do dia a dia, encenada.",
 "6. Fim: Fechamento": "O CTA pode ser um produto, um serviço, uma consultoria, uma newsletter, um grupo ou simplesmente o próximo vídeo da série. A ordem continua a mesma: ponte → oferta → revelação → próximo vídeo.",
 "CTA do negócio": "Sem produto ainda? Use o mesmo modelo para levar a uma lista de e-mail, a um grupo ou à próxima parte de uma série.",
 "8. Edição": "A regra de alternar estímulos vale para qualquer formato; o que muda é o tipo de troca: tela no tutorial, close no produto na review, b-roll no vlog, gráfico na análise."
};

/* ---------- MODEL ---------- */
const CATS = ['--cat1','--cat2','--cat3','--cat4','--cat5','--cat6','--cat7','--cat8','--cat9'];
const nodes = []; const byId = {};
(function walk(n, parent, depth, cat){
  n.id = nodes.length; n.parent = parent; n.depth = depth; n.cat = cat; n.kids = n.k || [];
  nodes.push(n); byId[n.id] = n;
  n.kids.forEach((k,i)=> walk(k, n, depth+1, depth===0 ? CATS[i] : cat));
})(DATA, null, 0, '--text-3');
const path = n => { const p=[]; for(let a=n;a;a=a.parent) p.unshift(a); return p; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const countAll = n => n.kids.reduce((s,k)=>s+1+countAll(k),0);

/* ---------- NOTES ----------
   Saved privately per viewer in the artifact db (data/users/<id>), so they follow the person
   across devices; browser storage is the instant cache and the fallback when db is absent. */
const KEY = 'arquitetura-video-notas-v2';
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ notes = {}; }
const noteId = n => 'p' + n.id;
const noteKey = noteId;
const label = n => path(n).slice(1).map(p=>p.n).join(' / ');
let notesCol = null; let notesWhere = 'neste navegador';
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); return true; } catch(e){ return false; } };
async function saveNote(n){
  const ok = saveLocal();
  if(!notesCol) return ok;
  const ref = notesCol.doc(noteId(n)); const text = (notes[noteId(n)]||'');
  try { if(text.trim()) await ref.set({text, label: label(n), updatedAt: Date.now()}); else await ref.delete(); return true; }
  catch(e){ return ok; }
}
(async function connectNotes(){
  if(!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db || !uid) return;
    const col = db.collection('data/users/' + uid);
    const snap = await Promise.race([col.get(), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
    const remote = {}; snap.docs.forEach(d=>{ const v=d.data(); if(v && typeof v.text==='string') remote[d.id]=v.text; });
    notesCol = col; notesWhere = 'na sua conta';
    for(const [k,v] of Object.entries(notes)){ if(!(k in remote) && v && v.trim()){ const n=byId[+k.slice(1)]; if(n){ remote[k]=v; try{ await col.doc(k).set({text:v,label:label(n),updatedAt:Date.now()}); }catch(e){} } } }
    notes = remote; saveLocal(); refreshNoteMarks();
    const ta = document.getElementById('note'); if(ta && cur && document.activeElement!==ta) ta.value = notes[noteId(cur)] || '';
    if(document.getElementById('dl') !== null || location.hash==='#anotacoes') renderNotes();
  } catch(e){ /* keep browser storage */ }
})();
function refreshNoteMarks(){
  const filled = Object.values(notes).filter(v=>v && v.trim()).length;
  document.getElementById('ncount').textContent = filled;
  document.querySelectorAll('.lnk').forEach(b=>{ const n=byId[b.dataset.id]; b.classList.toggle('has-note', !!(notes[noteKey(n)]||'').trim()); });
}

/* ---------- TREE (mind map by categories) ---------- */
const tree = document.getElementById('tree');
const open = new Set([0]);
const caret = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
function li(n){
  const has = n.kids.length>0, isOpen = open.has(n.id);
  return `<li class="lvl${Math.min(n.depth,2)}" data-id="${n.id}">
    <div class="row${cur===n?' cur':''}">
      <button class="car${has?'':' leaf'}" data-t="${n.id}" aria-expanded="${isOpen}" aria-label="${isOpen?'Fechar':'Abrir'} ${esc(n.n)}" ${has?'':'tabindex="-1" aria-hidden="true"'}>${caret}</button>
      <button class="lnk" data-id="${n.id}" ${cur===n?'aria-current="page"':''}>${n.depth===1?`<i class="dot" style="background:var(${n.cat})"></i>`:''}${esc(n.n)}</button>
    </div>
    ${has && isOpen ? `<ul>${n.kids.map(li).join('')}</ul>` : ''}
  </li>`;
}
function renderTree(){ tree.innerHTML = DATA.kids.map(li).join(''); applySearch(); refreshNoteMarks(); }
tree.addEventListener('click', e=>{
  const t = e.target.closest('[data-t]'); if(t){ const id=+t.dataset.t; open.has(id)?open.delete(id):open.add(id); renderTree(); return; }
  const l = e.target.closest('.lnk'); if(l){ go(byId[l.dataset.id]); closeMap(); }
});
const search = document.getElementById('search');
function applySearch(){
  const q = search.value.trim().toLowerCase();
  if(!q){ tree.querySelectorAll('li').forEach(x=>x.hidden=false); return; }
  tree.querySelectorAll('li').forEach(x=>{ x.hidden = !x.textContent.toLowerCase().includes(q); });
}
search.addEventListener('input', ()=>{
  const q = search.value.trim().toLowerCase();
  if(q){ nodes.forEach(n=>{ if(n.n.toLowerCase().includes(q)) path(n).forEach(p=>open.add(p.id)); }); }
  renderTree();
});

/* ---------- PAGE ---------- */
const page = document.getElementById('page');
let cur = null;
function optBtn(k, label){
  const sub = k.kids.length ? `${k.kids.length} ${k.kids.length===1?'parte':'partes'}` : '';
  return `<button class="opt" data-go="${k.id}">${k.depth===1?`<i class="dot" style="background:var(${k.cat})"></i>`:''}<span>${esc(k.n)}${label?`<small>${label}</small>`:''}</span>${sub?`<span class="n">${sub}</span>`:''}</button>`;
}
function render(n){
  const x = n, p = path(n), parent = n.parent;
  let h = `<div class="fade">`;
  h += `<nav class="crumb" aria-label="Caminho">${p.slice(0,-1).map(a=>`<button data-go="${a.id}">${esc(a.n==='Vídeo'?'Início':a.n)}</button>`).join('<span>/</span>')}</nav>`;
  if(n.depth>=1){ const top=p[1]; h += `<div class="cat"><i class="dot" style="background:var(${top.cat})"></i>${esc(top.n)}</div>`; }
  h += `<h1>${n.depth===0 ? 'Arquitetura do vídeo' : esc(x.n)}</h1>`;
  if(x.o) h += `<p class="lead">${esc(x.o)}</p>`;

  /* access options right after the definition */
  if(n.kids.length){
    h += `<section class="opts"><h2>${n.depth===0?'Categorias':'Abrir as partes de dentro'}</h2><p class="hint">${n.depth===0?'Escolha uma categoria para ver a estrutura dela.':'Clique numa parte para ver a estrutura e a explicação dela.'}</p><div class="grid">${n.kids.map(k=>optBtn(k)).join('')}</div></section>`;
  }
  h += `<div class="blocks">`;
  if(x.p) h += `<section class="block"><h2>Por que funciona</h2><p>${esc(x.p)}</p></section>`;
  if(x.c) h += `<section class="block"><h2>Como aplicar</h2><ol>${x.c.map(i=>`<li>${esc(i)}</li>`).join('')}</ol></section>`;
  if(ADAPT[x.n]) h += `<section class="block"><h2>Como adaptar a qualquer tema e formato</h2><p>${esc(ADAPT[x.n])}</p></section>`;
  if(x.f) h += `<section class="block"><h2>Frase-modelo</h2><p class="quote">${esc(x.f)}</p></section>`;
  if(x.e) h += `<section class="block"><h2>Exemplo do vídeo analisado</h2><p class="quote">${esc(x.e)}</p></section>`;
  if(x.x) h += `<section class="block err"><h2>Erros comuns</h2><ul>${x.x.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></section>`;

  /* notes */
  if(n.depth>0) h += `<section class="block notes"><h2><label for="note">Anotações</label></h2><textarea id="note" placeholder="Escreva aqui como você vai aplicar esta parte no seu vídeo…">${esc(notes[noteKey(n)]||'')}</textarea><div class="st" id="nst" aria-live="polite"></div></section>`;
  h += `</div>`;

  /* access options between parts: siblings + up */
  if(parent){
    const sibs = parent.kids.filter(s=>s!==n);
    h += `<section class="opts"><h2>Outras partes de ${esc(parent.n==='Vídeo'?'o vídeo':parent.n)}</h2><div class="grid">${parent.depth>0?optBtn(parent,'Voltar para a parte acima'):''}${sibs.map(s=>optBtn(s)).join('')}</div></section>`;
  }
  const i = nodes.indexOf(n), pv = nodes[i-1], nx = nodes[i+1];
  h += `<nav class="pager" aria-label="Passo a passo"><button class="pg" data-go="${pv?pv.id:''}" ${pv?'':'disabled'}><small>Anterior</small><b>${pv?esc(pv.n==='Vídeo'?'Início':pv.n):'—'}</b></button><button class="pg nx" data-go="${nx?nx.id:''}" ${nx?'':'disabled'}><small>Próximo passo</small><b>${nx?esc(nx.n):'Fim do mapa'}</b></button></nav>`;
  h += `</div>`;
  page.innerHTML = h;

  const ta = document.getElementById('note');
  if(ta){ let t; ta.addEventListener('input', ()=>{ notes[noteKey(n)] = ta.value; clearTimeout(t); t=setTimeout(async ()=>{ const st=document.getElementById('nst'); if(st) st.textContent='Salvando…'; const ok = await saveNote(n); const st2=document.getElementById('nst'); if(st2) st2.textContent = ok ? 'Salvo ' + notesWhere : 'Não foi possível salvar agora'; refreshNoteMarks(); }, 500); }); }
}
function renderNotes(){
  cur = null; renderTree();
  const items = nodes.filter(n=>(notes[noteKey(n)]||'').trim());
  let h = `<div class="fade"><nav class="crumb"><button data-go="0">Início</button></nav><h1>Minhas anotações</h1><p class="lead">Tudo o que você escreveu nas partes do mapa, na ordem da construção. As anotações ficam salvas só para você.</p>`;
  h += `<div class="actions"><button class="btn-p" id="dl" ${items.length?'':'disabled'}>Baixar anotações (.md)</button><button class="btn-s" data-go="1">Começar pelo passo 1</button></div><p class="st" id="dlst" aria-live="polite" style="font-size:13px;color:var(--text-3);margin-top:8px"></p>`;
  h += items.length ? `<div class="nlist">${items.map(n=>`<div class="nitem"><button data-go="${n.id}">${esc(label(n))}</button><p>${esc(notes[noteKey(n)])}</p></div>`).join('')}</div>` : `<p class="note-line">Nenhuma anotação ainda. Abra uma parte do mapa e escreva no campo “Anotações” no fim da página.</p>`;
  h += `</div>`;
  page.innerHTML = h;
  const dl = document.getElementById('dl');
  if(dl) dl.onclick = async ()=>{
    const md = '# Minhas anotações: arquitetura do vídeo\n\n' + items.map(n=>`## ${label(n)}\n\n${notes[noteKey(n)].trim()}\n`).join('\n');
    const st = document.getElementById('dlst'); const filename = 'anotacoes-arquitetura-video.md';
    let dls = null; try { dls = window.claude && claude.use ? await claude.use('downloads') : null; } catch(e){}
    if(dls){
      try { await dls.save({filename, data: md}); st.textContent = 'Arquivo salvo.'; }
      catch(e){ st.textContent = e && e.code==='declined' ? 'Download cancelado.' : e && e.code==='rate_limited' ? 'Aguarde um instante e tente de novo.' : 'O download não está disponível aqui.'; }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download = filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  scrollTo({top:0});
  history.replaceState(null,'','#anotacoes');
}
function go(n, push=true){
  if(!n) return;
  cur = n; path(n).forEach(p=>open.add(p.id)); if(n.kids.length) open.add(n.id);
  renderTree(); render(n);
  const row = tree.querySelector(`.row.cur`); if(row) row.scrollIntoView({block:'nearest'});
  scrollTo({top:0});
  if(push) history.replaceState(null,'','#p'+n.id);
}
page.addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b && b.dataset.go!=='') go(byId[b.dataset.go]); });
document.getElementById('goNotes').onclick = renderNotes;

/* mobile drawer */
const map = document.getElementById('map'), scrim = document.getElementById('scrim');
function closeMap(){ map.classList.remove('open'); scrim.classList.remove('on'); }
document.getElementById('openMap').onclick = ()=>{ map.classList.add('open'); scrim.classList.add('on'); const r=tree.querySelector('.row.cur .lnk')||search; r.focus({preventScroll:false}); };
scrim.onclick = closeMap;
addEventListener('keydown', e=>{ if(e.key==='Escape') closeMap(); });

/* start */
const m = location.hash.match(/^#p(\d+)$/);
if(location.hash==='#anotacoes') renderNotes(); else go(m && byId[m[1]] ? byId[m[1]] : DATA, false);
</script>
</body>
</html>
